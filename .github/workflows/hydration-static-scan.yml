name: Hydration Static Scan

on:
  push:
    branches: [debug/hydration-scan]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect render boundaries and hydration risks
        shell: bash
        run: |
          set +e
          echo '=== Component declarations ==='
          grep -nE '^function |^export default function ' app/page.js
          echo '=== Login and auth area ==='
          grep -n -B2 -A35 'function LoginScreen' app/page.js
          echo '=== Main render nondeterminism ==='
          sed -n '1368,1395p' app/page.js
          echo '=== Browser globals outside effects/callbacks candidates ==='
          grep -nE 'Math\.random|new Date\(\)|Date\.now|toLocale|window\.|document\.|sessionStorage|navigator\.' app/page.js
          exit 0
