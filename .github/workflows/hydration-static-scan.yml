name: Hydration Static Scan

on:
  push:
    branches: [debug/hydration-scan]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Scan hydration risk expressions
        shell: bash
        run: |
          set +e
          echo '=== Hydration risk expressions ==='
          grep -nE 'Math\.random|Date\.now|new Date\(|toLocale|window\.|document\.|localStorage|sessionStorage|navigator\.|crypto\.randomUUID|Intl\.' app/page.js
          echo '=== Context around root render date ==='
          sed -n '1360,1400p' app/page.js
          echo '=== Context around root component ==='
          sed -n '1080,1200p' app/page.js
          echo '=== Context around auth component ==='
          sed -n '1640,1710p' app/page.js
          echo '=== End scan ==='
          exit 0
