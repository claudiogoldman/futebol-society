name: One-shot draw history sync fix

on:
  push:
    branches:
      - refactor/game-teams-integration

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[draw-history-sync-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply sync fix
        shell: python
        run: |
          from pathlib import Path
          import re

          page = Path('app/society-page.js')
          source = page.read_text(encoding='utf-8')
          original = source

          old_sig = "  onSetGameOrganizer, onSetGameLocation, onDraw, onSaveTeams,\n  onTogglePaid, onSaveResult, onSavePlayerStats, onSaveRatings,"
          new_sig = "  onSetGameOrganizer, onSetGameLocation, onDraw, onSaveTeams, onGameRefresh,\n  onTogglePaid, onSaveResult, onSavePlayerStats, onSaveRatings,"
          if old_sig in source and 'onGameRefresh' not in source:
              source = source.replace(old_sig, new_sig, 1)

          invocation = "          game={game}\n          activePlayers={activePlayers}\n          canManage={canManage}"
          replacement = "          game={game}\n          roster={roster}\n          activePlayers={activePlayers}\n          canManage={canManage}"
          if invocation in source and '          roster={roster}' not in source:
              source = source.replace(invocation, replacement, 1)

          teams_end = "          onSaveTeams={onSaveTeams}\n          isGoalkeeper={isGoleiro}"
          teams_replacement = "          onSaveTeams={onSaveTeams}\n          onGameRefresh={onGameRefresh}\n          isGoalkeeper={isGoleiro}"
          if teams_end in source and 'onGameRefresh={onGameRefresh}' not in source:
              source = source.replace(teams_end, teams_replacement, 1)

          call_marker = "            onDraw={handleDraw}\n            onSaveTeams={handleSaveTeams}"
          call_replacement = "            onDraw={handleDraw}\n            onSaveTeams={handleSaveTeams}\n            onGameRefresh={loadAll}"
          if call_marker in source and 'onGameRefresh={loadAll}' not in source:
              source = source.replace(call_marker, call_replacement, 1)

          if source == original:
              raise SystemExit('No society-page changes needed')
          page.write_text(source, encoding='utf-8')

          comp = Path('components/society/GameTeamsSection.js')
          c = comp.read_text(encoding='utf-8')
          co = c
          c = c.replace("  onSaveTeams,\n  isGoalkeeper,", "  onSaveTeams,\n  onGameRefresh,\n  isGoalkeeper,", 1)
          c = c.replace("    setHistoryError('');\n    await loadHistory();\n    return !!data;", "    setHistoryError('');\n    await onGameRefresh?.();\n    await loadHistory();\n    return !!data;", 1)
          c = c.replace("    () => new Map(activePlayers.map((player) => [String(player.id), player])),", "    () => new Map(roster.map((player) => [String(player.id), player])),", 1)
          c = c.replace("  game,\n  activePlayers,", "  game,\n  roster = activePlayers,\n  activePlayers,", 1)
          c = c.replace("        roster={activePlayers}", "        roster={roster}", 1)
          if c == co:
              raise SystemExit('No GameTeamsSection changes needed')
          comp.write_text(c, encoding='utf-8')
      - name: Validate and commit
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git add app/society-page.js components/society/GameTeamsSection.js
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(game-detail): synchronize restored draw with parent state [draw-history-sync-fixed]"
          git push origin HEAD:refactor/game-teams-integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
