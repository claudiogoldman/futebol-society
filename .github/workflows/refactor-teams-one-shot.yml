name: One-shot Teams Refactor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message == 'chore: trigger teams refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Teams section from match page
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text()
          assert len(s) > 150_000, f'unexpected page size: {len(s)}'
          imp = "import TacticalPitch from '../components/society/TacticalPitch';\n"
          assert s.count(imp) == 1
          s = s.replace(imp, '', 1)
          pitch = "function PitchView({ teamA, teamB, playersPerTeam, reservesPerTeam }) {\n  return (\n    <TacticalPitch\n      teamA={teamA}\n      teamB={teamB}\n      playersPerTeam={playersPerTeam}\n      reservesPerTeam={reservesPerTeam}\n    />\n  );\n}\n"
          assert s.count(pitch) == 1
          s = s.replace(pitch, '', 1)
          start = s.index('      <section className="sf-card">\n        <div className="sf-card-title"><Shuffle size={16} /> Times</div>')
          end = s.index('      <section className="sf-card">\n        <div className="sf-card-title"><Wallet size={16} /> Rateio</div>', start)
          replacement = '''      <GameTeamsSection
        game={game}
        activePlayers={activePlayers}
        canManage={canManage}
        hasTeams={hasTeams}
        playersPerTeam={playersPerTeam}
        reservesPerTeam={reservesPerTeam}
        editingTeams={editingTeams}
        teamDraft={teamDraft}
        setTeamDraft={setTeamDraft}
        setEditingTeams={setEditingTeams}
        onDraw={onDraw}
        onSaveTeams={onSaveTeams}
        isGoalkeeper={isGoleiro}
      />\n\n'''
          s = s[:start] + replacement + s[end:]
          import_marker = "import GameChat from '../components/chat/GameChat';\n"
          assert import_marker in s and "../components/society/GameTeamsSection" not in s
          s = s.replace(import_marker, import_marker + "import GameTeamsSection from '../components/society/GameTeamsSection';\n", 1)
          p.write_text(s)
          assert len(s) > 140_000, f'page shrank unexpectedly: {len(s)}'
          assert 'GameTeamsSection' in s
          assert 'function PitchView' not in s
          assert "TacticalPitch from '../components/society/TacticalPitch'" not in s
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/society-page.js
          git commit -m 'refactor(teams): compose match page from GameTeamsSection'
          git rm .github/workflows/refactor-teams-one-shot.yml
          git commit -m 'chore: remove one-shot refactor workflow'
          git push
