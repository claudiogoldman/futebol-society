name: Audit team management

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fix post-game permissions and participant removal
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text()

          old = "  const canManage = myId === game.createdBy || (game.groupId && groupMembers.some((m) => String(m.group_id) === String(game.groupId) && String(m.user_id) === String(myId) && m.role === 'admin'));"
          new = "  const isGameAdmin = !!(game.groupId && groupMembers.some((m) => String(m.group_id) === String(game.groupId) && String(m.user_id) === String(myId) && m.role === 'admin'));\n  // Before completion, the creator can manage the match. After completion,\n  // structural changes are restricted to group admins; the creator may still\n  // record/correct the final score.\n  const canManage = !game.result && myId === game.createdBy || isGameAdmin;\n  const canRecordResult = myId === game.createdBy || isGameAdmin;"
          if old not in s: raise SystemExit('canManage declaration not found')
          s = s.replace(old, new, 1)

          old = "  // editing is creator-only, with no admin override — admins can still SEE\n  // every match (that's handled server-side via RLS visibility), just not edit it\n"
          s = s.replace(old, '', 1)

          old = "                <span className=\"sf-rsvp-name\">\n                  {isGoleiro(p) && <span className=\"sf-gk-tag\" title=\"Goleiro\"><Hand size={10} /> GOL</span>}\n                  {p.name}{p.id === myId ? ' (você)' : ''}\n                </span>\n                {onWaitlist && <span className=\"sf-waitlist-tag\">espera #{waitlistPlayers.findIndex((w) => w.id === p.id) + 1}</span>}\n                <StarRating value={p.rating} readOnly size={12} onChange={() => {}} />"
          new = "                <span className=\"sf-rsvp-name\">\n                  {isGoleiro(p) && <span className=\"sf-gk-tag\" title=\"Goleiro\"><Hand size={10} /> GOL</span>}\n                  {p.name}{p.id === myId ? ' (você)' : ''}\n                </span>\n                {onWaitlist && <span className=\"sf-waitlist-tag\">espera #{waitlistPlayers.findIndex((w) => w.id === p.id) + 1}</span>}\n                <StarRating value={p.rating} readOnly size={12} onChange={() => {}} />\n                {canManage && on && p.id !== myId && <button type=\"button\" className=\"sf-mini-btn\" title=\"Remover jogador da partida\" onClick={() => onRemoveParticipant(game.id, p.id)}>×</button>}"
          if old not in s: raise SystemExit('participant row not found')
          s = s.replace(old, new, 1)

          old = "      {hasTeams && canManage && (\n        <section className=\"sf-card\">\n          <div className=\"sf-card-title\"><Trophy size={16} /> Resultado</div>"
          new = "      {hasTeams && canRecordResult && (\n        <section className=\"sf-card\">\n          <div className=\"sf-card-title\"><Trophy size={16} /> Resultado</div>"
          if old not in s: raise SystemExit('result management block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit audit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/society-page.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: enforce post-game management permissions"
          git push
