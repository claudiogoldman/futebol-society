name: Apply remaining Society UI

on:
  push:
    branches: [feat/complete-remaining-ui]

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-remaining-ui
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply UI patch
        run: python3 scripts/finalize-remaining-ui.py
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJjaGF0Z3B0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDAsImV4cCI6NDcwMH0.placeholder
      - name: Commit patched UI
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/page.js
            git commit -m 'feat: complete nationality, group roles and game participants UI'
            git push origin HEAD:feat/complete-remaining-ui
          fi
