name: Fix waitlist icon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch missing icon reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text()
          old = '<Clock3 size={16} /> Você tá na espera'
          new = '<span aria-hidden="true">⏳</span> Você tá na espera'
          if old not in s:
              raise SystemExit('Clock3 reference not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/fix-clock3.yml .github/maintenance-trigger.txt
          git add app/society-page.js .github/workflows .github/maintenance-trigger.txt
          git commit -m "fix: remove undefined waitlist icon reference"
          git push
