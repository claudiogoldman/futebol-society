name: Consistency refactor v4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply consistency refactor v4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch application
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text()

          replacements = [
            (
              "  const [locationDraft, setLocationDraft] = useState({ name: '', address: '', city: '', state: '', latitude: '', longitude: '', isDefault: false });\n",
              "  const [locationDraft, setLocationDraft] = useState({ name: '', address: '', city: '', state: '', latitude: '', longitude: '', isDefault: false });\n  const [defaultLocationDraft, setDefaultLocationDraft] = useState('');\n"
            ),
            (
              "    setAvatarUrlDraft(group.avatarUrl || '');\n    setEditing(false);\n",
              "    setAvatarUrlDraft(group.avatarUrl || '');\n    setDefaultLocationDraft('');\n    setEditing(false);\n"
            ),
            (
              "  const save = async () => {\n    const ok = await onSetDefaults(group.id, {\n      name: nameDraft.trim() || group.name,\n      default_local: group.defaultLocal || null,\n",
              "  const save = async () => {\n    const selectedDefaultLocation = locations.find((l) => String(l.id) === String(defaultLocationDraft));\n    const ok = await onSetDefaults(group.id, {\n      name: nameDraft.trim() || group.name,\n      default_local: selectedDefaultLocation?.name || null,\n"
            ),
            (
              "            {canManage && <button className=\"sf-btn-ghost\" style={{ width: '100%', marginTop: 6 }} onClick={() => setEditing(true)}>Editar padrões</button>}\n",
              "            {canManage && <button className=\"sf-btn-ghost\" style={{ width: '100%', marginTop: 6 }} onClick={() => { const current = locations.find((l) => l.is_default || l.isDefault); setDefaultLocationDraft(current?.id || ''); setEditing(true); }}>Editar padrões</button>}\n"
            ),
            (
              "            <select className=\"sf-input\" value={locations.find((l) => l.is_default)?.id || \"\"} onChange={(e) => onSetDefaultLocation(group.id, e.target.value || null)}>\n",
              "            <select className=\"sf-input\" value={defaultLocationDraft} onChange={(e) => setDefaultLocationDraft(e.target.value)}>\n"
            ),
            (
              "    if (ok) setEditing(false);\n  };\n",
              "    if (!ok) return;\n    const locationOk = await onSetDefaultLocation(group.id, defaultLocationDraft || null);\n    if (locationOk !== false) setEditing(false);\n  };\n"
            ),
            (
              "  const setGroupDefaultLocation = async (groupId, locationId) => {\n    if (locationId) {\n      const { error } = await supabase.from('group_locations').update({ is_default: true }).eq('id', locationId).eq('group_id', groupId);\n      if (error) { alert('Não foi possível definir o local padrão: ' + error.message); return; }\n    } else {\n      const { error } = await supabase.from('group_locations').update({ is_default: false }).eq('group_id', groupId);\n      if (error) { alert('Não foi possível remover o local padrão: ' + error.message); return; }\n    }\n    await loadAll();\n  };\n",
              "  const setGroupDefaultLocation = async (groupId, locationId) => {\n    const { error } = await supabase.rpc('set_group_default_location', { p_group_id: groupId, p_location_id: locationId || null });\n    if (error) { alert('Não foi possível definir o local padrão: ' + error.message); return false; }\n    await loadAll();\n    return true;\n  };\n"
            ),
            (
              "  const setGamePixDetails = async (gameId, { pixKey, pixReceiverName, pixCity, pixOwnerId }) => {\n    await supabase.from('games').update({\n      pix_key: pixKey || null,\n      pix_receiver_name: pixReceiverName || null,\n      pix_city: pixCity || null,\n      pix_owner_id: pixOwnerId || null,\n    }).eq('id', gameId);\n    loadAll();\n  };\n",
              "  const setGamePixDetails = async (gameId, { pixKey, pixReceiverName, pixCity, pixOwnerId }) => {\n    const { error } = await supabase.from('games').update({\n      pix_key: pixKey || null,\n      pix_receiver_name: pixReceiverName || null,\n      pix_city: pixCity || null,\n      pix_owner_id: pixOwnerId || null,\n    }).eq('id', gameId);\n    if (error) { alert('Não foi possível salvar os dados do Pix: ' + error.message); return false; }\n    await loadAll();\n    return true;\n  };\n"
            ),
            (
              "  const setGameLocation = async (gameId, { local, locationAddress, locationCity, locationState, locationLatitude, locationLongitude }) => {\n    await supabase.from('games').update({ local: local || null, location_address: locationAddress, location_city: locationCity, location_state: locationState, location_latitude: locationLatitude, location_longitude: locationLongitude }).eq('id', gameId);\n    loadAll();\n  };\n",
              "  const setGameLocation = async (gameId, { local, locationAddress, locationCity, locationState, locationLatitude, locationLongitude }) => {\n    const { error } = await supabase.from('games').update({ local: local || null, location_address: locationAddress, location_city: locationCity, location_state: locationState, location_latitude: locationLatitude, location_longitude: locationLongitude }).eq('id', gameId);\n    if (error) { alert('Não foi possível salvar o local da partida: ' + error.message); return false; }\n    await loadAll();\n    return true;\n  };\n"
            ),
            (
              "  const togglePaid = async (gameId, userId, paid) => {\n    await supabase.from('payments').upsert({ game_id: gameId, user_id: userId, paid });\n    loadAll();\n  };\n",
              "  const togglePaid = async (gameId, userId, paid) => {\n    const { error } = await supabase.from('payments').upsert({ game_id: gameId, user_id: userId, paid });\n    if (error) { alert('Não foi possível atualizar o pagamento: ' + error.message); return false; }\n    await loadAll();\n    return true;\n  };\n"
            ),
            (
              "  const handleDraw = async (gameId, confirmedPlayers) => {\n    const { teamA, teamB } = drawTeams(confirmedPlayers);\n    await supabase.from('game_teams').delete().eq('game_id', gameId);\n    const rows = [\n      ...teamA.map((p) => ({ game_id: gameId, user_id: p.id, team: 'A' })),\n      ...teamB.map((p) => ({ game_id: gameId, user_id: p.id, team: 'B' })),\n    ];\n    if (rows.length) await supabase.from('game_teams').insert(rows);\n    loadAll();\n  };\n",
              "  const handleDraw = async (gameId, confirmedPlayers) => {\n    const { teamA, teamB } = drawTeams(confirmedPlayers);\n    const { error: deleteError } = await supabase.from('game_teams').delete().eq('game_id', gameId);\n    if (deleteError) { alert('Não foi possível limpar o sorteio anterior: ' + deleteError.message); return false; }\n    const rows = [\n      ...teamA.map((p) => ({ game_id: gameId, user_id: p.id, team: 'A' })),\n      ...teamB.map((p) => ({ game_id: gameId, user_id: p.id, team: 'B' })),\n    ];\n    if (rows.length) {\n      const { error } = await supabase.from('game_teams').insert(rows);\n      if (error) { alert('Não foi possível salvar o sorteio: ' + error.message); return false; }\n    }\n    await loadAll();\n    return true;\n  };\n"
            ),
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit('Patch target not found: ' + old[:100].replace('\\n', ' '))
            s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Validate source
        run: |
          grep -n "defaultLocationDraft" app/society-page.js
          grep -n "set_group_default_location" app/society-page.js
          node --check app/society-page.js

      - name: Commit source changes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/society-page.js
          git rm .github/workflows/refactor-consistency-v4.yml
          git commit -m "chore: apply consistency refactor v4"
          git push
