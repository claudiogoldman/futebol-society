name: Android TWA Build

on:
  workflow_dispatch:
  push:
    branches:
      - android-play-store

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SIGNING_ENABLED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout Android branch
        uses: actions/checkout@v4
        with:
          ref: android-play-store

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Configure Bubblewrap paths
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          test -d "${SDK_PATH}"
          test -d "${SDK_PATH}/build-tools"
          test -d "${JAVA_HOME}"

          mkdir -p "${HOME}/.bubblewrap"
          cat > "${HOME}/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${SDK_PATH}"
          }
          EOF

          bubblewrap doctor

      - name: Generate Android project
        run: bubblewrap update --manifest=android/twa-manifest.json --directory=android --skipVersionUpgrade

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f android/gradlew
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          chmod +x android/gradlew
          echo "Android project generated successfully"

      - name: Prepare signing key
        if: env.SIGNING_ENABLED == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is empty"
            exit 1
          fi
          echo "ANDROID_KEYSTORE_BASE64: present (${#ANDROID_KEYSTORE_BASE64} characters)"

          if [ -z "${BUBBLEWRAP_KEYSTORE_PASSWORD}" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD is empty"
            exit 1
          fi
          echo "BUBBLEWRAP_KEYSTORE_PASSWORD: present"

          if [ -z "${BUBBLEWRAP_KEY_PASSWORD}" ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD is empty"
            exit 1
          fi
          echo "BUBBLEWRAP_KEY_PASSWORD: present"

          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/android.keystore
          test -s android/android.keystore
          echo "Decoded keystore size: $(wc -c < android/android.keystore) bytes"

          keytool -list \
            -keystore android/android.keystore \
            -alias society \
            -storepass "${BUBBLEWRAP_KEYSTORE_PASSWORD}" >/dev/null

          echo "Signing key loaded successfully"

      - name: Build signed App Bundle
        if: env.SIGNING_ENABLED == 'true'
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          bubblewrap build \
            --manifest=twa-manifest.json \
            --signingKeyPath=android.keystore \
            --signingKeyAlias=society

      - name: Build unsigned App Bundle
        if: env.SIGNING_ENABLED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Generate signing fingerprint and Digital Asset Links
        if: env.SIGNING_ENABLED == 'true'
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android-signing

          SHA256=$(keytool -list -v \
            -keystore android/android.keystore \
            -alias society \
            -storepass "${BUBBLEWRAP_KEYSTORE_PASSWORD}" \
            | awk -F': ' '/SHA256:/{print $2; exit}' \
            | tr -d '\r')

          test -n "${SHA256}"
          echo "${SHA256}" > android-signing/sha256.txt

          mkdir -p android-signing/.well-known
          cat > android-signing/.well-known/assetlinks.json <<EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "br.com.treinadorideal.futebolsociety",
                "sha256_cert_fingerprints": ["${SHA256}"]
              }
            }
          ]
          EOF

          echo "Digital Asset Links generated"

      - name: Upload signed AAB
        if: env.SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: futebol-society-aab-signed
          path: android/app-release-bundle.aab
          if-no-files-found: error

      - name: Upload signing metadata
        if: env.SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: futebol-society-assetlinks
          path: android-signing/
          if-no-files-found: error

      - name: Upload unsigned AAB
        if: env.SIGNING_ENABLED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: futebol-society-aab-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
