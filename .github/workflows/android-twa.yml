name: Android TWA Build

on:
  workflow_dispatch:
  push:
    branches:
      - android-play-store

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Generate Android project
        run: bubblewrap update --manifest=android/twa-manifest.json --skipVersionUpgrade

      - name: Build unsigned App Bundle
        run: bubblewrap build --manifest=android/twa-manifest.json --skipSigning

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: futebol-society-aab
          path: '**/*-bundle.aab'
          if-no-files-found: error
