name: Android TWA Build

on:
  workflow_dispatch:
  push:
    branches:
      - android-play-store

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Android branch
        uses: actions/checkout@v4
        with:
          ref: android-play-store

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Configure Bubblewrap paths
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          test -d "${SDK_PATH}"
          test -d "${SDK_PATH}/build-tools"
          test -d "${JAVA_HOME}"

          echo "JAVA_HOME=${JAVA_HOME}"
          echo "Android SDK=${SDK_PATH}"

          mkdir -p "${HOME}/.bubblewrap"
          cat > "${HOME}/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${SDK_PATH}"
          }
          EOF

          bubblewrap doctor

      - name: Generate Android project
        run: bubblewrap update --manifest=android/twa-manifest.json --directory=android --skipVersionUpgrade

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f android/gradlew
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          chmod +x android/gradlew
          echo "Android project generated successfully"

      - name: Build unsigned App Bundle
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: futebol-society-aab
          path: 'android/app/build/outputs/bundle/release/*.aab'
          if-no-files-found: error
