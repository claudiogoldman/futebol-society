name: Restore game management

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore game management UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text()

          # 1) GameDetail API + state
          old = "function GameDetail({ game, roster, groupMembers, groupMemberIds, myId, isAdmin, onBack, onToggleMyRSVP, onAddParticipant, onRemoveParticipant, onSetCost, onSetGkPays, onSetMaxPlayers, onSetGamePixDetails, onSetGameOrganizer, onSetGameLocation, onDraw, onTogglePaid, onSaveResult, onSavePlayerStats, onSaveRatings, onDelete, onShare }) {"
          new = "function GameDetail({ game, roster, groupMembers, groupMemberIds, myId, isAdmin, onBack, onToggleMyRSVP, onAddParticipant, onAddGuest, onRemoveParticipant, onSetCost, onSetGkPays, onSetMaxPlayers, onSetGamePixDetails, onSetGameOrganizer, onSetGameLocation, onDraw, onTogglePaid, onSaveResult, onSavePlayerStats, onSaveRatings, onDelete, onShare }) {"
          if old not in s: raise SystemExit('GameDetail signature not found')
          s = s.replace(old, new, 1)
          old = "  const [participantDraft, setParticipantDraft] = useState('');"
          new = "  const [participantDraft, setParticipantDraft] = useState('');\n  const [managementOpen, setManagementOpen] = useState(false);\n  const [guestNameDraft, setGuestNameDraft] = useState('');\n  const [guestEmailDraft, setGuestEmailDraft] = useState('');\n  const [guestPositionDraft, setGuestPositionDraft] = useState('');"
          if old not in s: raise SystemExit('participant state not found')
          s = s.replace(old, new, 1)

          # 2) Restore Management dropdown in the game header (not group defaults)
          old = "        {canManage && <button className=\"sf-icon-btn sf-danger\" onClick={() => onDelete(game.id)}><Trash2 size={18} /></button>}\n"
          new = "        {canManage && (\n          <div style={{ position: 'relative', marginLeft: 'auto' }}>\n            <button type=\"button\" className=\"sf-admin-toggle\" onClick={() => setManagementOpen((v) => !v)}>Gestão ▾</button>\n            {managementOpen && (\n              <div style={{ position: 'absolute', right: 0, top: 'calc(100% + 6px)', zIndex: 20, minWidth: 220, background: 'var(--pitch-mid)', border: '1px solid var(--line)', borderRadius: 10, padding: 8, boxShadow: '0 8px 24px rgba(0,0,0,.35)' }}>\n                <button type=\"button\" className=\"sf-btn-ghost\" style={{ width: '100%', textAlign: 'left', marginBottom: 6 }} onClick={() => { setGuestNameDraft(''); setGuestEmailDraft(''); setGuestPositionDraft(''); setManagementOpen(false); document.getElementById('sf-add-guest-form')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); }}>Adicionar jogador não cadastrado</button>\n                <button type=\"button\" className=\"sf-btn-ghost\" style={{ width: '100%', textAlign: 'left' }} onClick={() => { setManagementOpen(false); document.getElementById('sf-game-location-card')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); }}>Gerenciar local da partida</button>\n              </div>\n            )}\n          </div>\n        )}\n        {canManage && <button className=\"sf-icon-btn sf-danger\" onClick={() => onDelete(game.id)}><Trash2 size={18} /></button>}\n"
          if old not in s: raise SystemExit('game header action not found')
          s = s.replace(old, new, 1)
          old = "      <section className=\"sf-card\">\n        <div className=\"sf-card-title\"><Target size={16} /> Local da partida</div>"
          new = "      <section id=\"sf-game-location-card\" className=\"sf-card\">\n        <div className=\"sf-card-title\"><Target size={16} /> Local da partida</div>"
          if old not in s: raise SystemExit('location card not found')
          s = s.replace(old, new, 1)

          # 3) Add guest form in Confirmados section, separate from registered player action
          old = "        {canManage && game.groupId && (\n          <div style={{ display: 'grid', gridTemplateColumns: '1fr auto', gap: 8, marginTop: 10 }}>"
          new = "        {canManage && (\n          <div id=\"sf-add-guest-form\" className=\"sf-card\" style={{ marginTop: 10, marginBottom: 0, padding: 10, background: 'var(--pitch-dark)' }}>\n            <div className=\"sf-card-subtitle\" style={{ marginTop: 0 }}>Adicionar jogador não cadastrado</div>\n            <input className=\"sf-input\" placeholder=\"Nome\" value={guestNameDraft} onChange={(e) => setGuestNameDraft(e.target.value)} />\n            <input className=\"sf-input\" style={{ marginTop: 6 }} type=\"email\" placeholder=\"E-mail (opcional)\" value={guestEmailDraft} onChange={(e) => setGuestEmailDraft(e.target.value)} />\n            <select className=\"sf-input\" style={{ marginTop: 6 }} value={guestPositionDraft} onChange={(e) => setGuestPositionDraft(e.target.value)}>\n              <option value=\"\">Posição (opcional)</option>\n              {POSITION_ORDER.map((pos) => <option key={pos} value={pos}>{POSITION_LABELS[pos]}</option>)}\n            </select>\n            <button className=\"sf-btn-ghost\" style={{ width: '100%', marginTop: 8 }} disabled={!guestNameDraft.trim()} onClick={async () => { const ok = await onAddGuest(game.id, guestNameDraft.trim(), guestEmailDraft.trim(), guestPositionDraft); if (ok) { setGuestNameDraft(''); setGuestEmailDraft(''); setGuestPositionDraft(''); } }}>Adicionar convidado</button>\n          </div>\n        )}\n        {canManage && game.groupId && (\n          <div style={{ display: 'grid', gridTemplateColumns: '1fr auto', gap: 8, marginTop: 10 }}>"
          if old not in s: raise SystemExit('participant block not found')
          s = s.replace(old, new, 1)

          # 4) MainApp callback
          old = "  const addParticipant = async (gameId, userId) => {"
          new = "  const addGuest = async (gameId, name, email, position) => {\n    const { error } = await supabase.rpc('add_game_guest', { p_game_id: gameId, p_name: name, p_email: email || null, p_nationality_code: 'BR', p_positions: position ? [position] : [] });\n    if (error) { alert('Não foi possível adicionar o convidado: ' + error.message); return false; }\n    await loadAll();\n    return true;\n  };\n\n  const addParticipant = async (gameId, userId) => {"
          if old not in s: raise SystemExit('addParticipant function not found')
          s = s.replace(old, new, 1)

          # 5) Pass callback to GameDetail
          old = "            onAddParticipant={addParticipant}\n            onRemoveParticipant={removeParticipant}"
          new = "            onAddParticipant={addParticipant}\n            onAddGuest={addGuest}\n            onRemoveParticipant={removeParticipant}"
          if old not in s: raise SystemExit('GameDetail callback area not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/society-page.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore game management and guest registration"
          git push
