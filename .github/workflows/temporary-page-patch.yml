name: Temporary page patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch organizer permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.js')
          s = p.read_text()
          old = """  // editing is creator-only, with no admin override — admins can still SEE
  // every match (that's handled server-side via RLS visibility), just not edit it
  const canManage = myId === game.createdBy;"""
          new = """  // The game creator and group admins can manage the match. The group owner
  // is represented as the effective admin by the database authorization rules.
  const canManage = myId === game.createdBy || isAdmin || groupMembers.some((m) =>
    String(m.group_id) === String(game.groupId) &&
    String(m.user_id) === String(myId) &&
    m.role === 'admin'
  );"""
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: allow group admins to manage games"
          git push
