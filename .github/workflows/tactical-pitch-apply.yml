name: Apply tactical pitch integration

on:
  push:
    paths:
      - '.github/workflows/tactical-pitch-apply.yml'
      - 'components/society/TacticalPitch.js'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate TacticalPitch into society page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/society-page.js')
          s = p.read_text()
          original = s

          import_line = "import GameChat from '../components/chat/GameChat';"
          tactical_import = "import TacticalPitch from '../components/society/TacticalPitch';"
          if tactical_import not in s:
              if import_line not in s:
                  raise SystemExit('GameChat import anchor not found')
              s = s.replace(import_line, import_line + '\n' + tactical_import, 1)

          replacement = """function PitchView({ teamA, teamB }) {
            return <TacticalPitch teamA={teamA} teamB={teamB} />;
          }

          """
          pattern = re.compile(r"function PitchView\(\{ teamA, teamB \}\) \{.*?\n\}\n\n(?=// ---------- login ----------)", re.S)
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('Existing PitchView block not found exactly once')

          if s == original:
              raise SystemExit('No changes detected')
          p.write_text(s)
          PY

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/society-page.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat(pitch): integrate reusable tactical pitch into match detail'
          git push
