name: One-time chat visibility fix
on:
  pull_request:
    branches: [main]
    types: [opened]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply minimal chat visibility gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text()
          old = '      <GameChat gameId={game.id} userId={myId} playerNames={playerNames} />'
          new = "      {iAmConfirmed && (\n        <GameChat gameId={game.id} userId={myId} playerNames={playerNames} />\n      )}"
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one chat render, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/one-time-chat-gate.yml
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/society-page.js .github/workflows/one-time-chat-gate.yml
          git diff --cached --check
          git commit -m 'fix: show game chat only to confirmed players'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}