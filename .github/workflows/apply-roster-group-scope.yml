name: Apply roster group scope

on:
  push:
    paths:
      - 'scripts/apply-roster-group-scope.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply roster scope
        run: python3 scripts/apply-roster-group-scope.py

      - name: Commit UI change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js scripts/apply-roster-group-scope.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: scope roster to user's groups"
          git push

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
