name: Refine game management

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Refine management UX
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text()

          s = s.replace("onAddParticipant, onAddGuest, onRemoveParticipant", "onAddParticipant, onAddGuest, onOpenGroup, onRemoveParticipant", 1)
          s = s.replace("  const [guestPositionDraft, setGuestPositionDraft] = useState('');", "  const [guestPositionDraft, setGuestPositionDraft] = useState('');\n  const [guestManagementOpen, setGuestManagementOpen] = useState(false);", 1)

          old = "onClick={() => { setGuestNameDraft(''); setGuestEmailDraft(''); setGuestPositionDraft(''); setManagementOpen(false); document.getElementById('sf-add-guest-form')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); }}"
          new = "onClick={() => { setGuestNameDraft(''); setGuestEmailDraft(''); setGuestPositionDraft(''); setManagementOpen(false); setGuestManagementOpen(true); setTimeout(() => document.getElementById('sf-add-guest-form')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 0); }}"
          if old not in s: raise SystemExit('guest menu action not found')
          s = s.replace(old, new, 1)

          old = "onClick={() => { setManagementOpen(false); document.getElementById('sf-game-location-card')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); }}>Gerenciar local da partida</button>"
          new = "onClick={() => { setManagementOpen(false); if (game.groupId) onOpenGroup(game.groupId); }}>Gerenciar locais do grupo</button>"
          if old not in s: raise SystemExit('location menu action not found')
          s = s.replace(old, new, 1)

          old = "        {canManage && (\n          <div id=\"sf-add-guest-form\" className=\"sf-card\" style={{ marginTop: 10, marginBottom: 0, padding: 10, background: 'var(--pitch-dark)' }}>"
          new = "        {canManage && guestManagementOpen && (\n          <div id=\"sf-add-guest-form\" className=\"sf-card\" style={{ marginTop: 10, marginBottom: 0, padding: 10, background: 'var(--pitch-dark)' }}>"
          if old not in s: raise SystemExit('guest form condition not found')
          s = s.replace(old, new, 1)

          old = "            <button className=\"sf-btn-ghost\" style={{ width: '100%', marginTop: 8 }} disabled={!guestNameDraft.trim()} onClick={async () => { const ok = await onAddGuest(game.id, guestNameDraft.trim(), guestEmailDraft.trim(), guestPositionDraft); if (ok) { setGuestNameDraft(''); setGuestEmailDraft(''); setGuestPositionDraft(''); } }}>Adicionar convidado</button>"
          new = "            <div className=\"sf-modal-actions\"><button className=\"sf-btn-ghost\" onClick={() => setGuestManagementOpen(false)}>Cancelar</button><button className=\"sf-btn-primary\" disabled={!guestNameDraft.trim()} onClick={async () => { const ok = await onAddGuest(game.id, guestNameDraft.trim(), guestEmailDraft.trim(), guestPositionDraft); if (ok) { setGuestNameDraft(''); setGuestEmailDraft(''); setGuestPositionDraft(''); setGuestManagementOpen(false); } }}>Adicionar convidado</button></div>"
          if old not in s: raise SystemExit('guest submit not found')
          s = s.replace(old, new, 1)

          old = "            onAddParticipant={addParticipant}\n            onAddGuest={addGuest}\n            onRemoveParticipant={removeParticipant}"
          new = "            onAddParticipant={addParticipant}\n            onAddGuest={addGuest}\n            onOpenGroup={(groupId) => { setTab('grupos'); setSelectedGroupId(groupId); setSelectedGameId(null); }}\n            onRemoveParticipant={removeParticipant}"
          if old not in s: raise SystemExit('main callback not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/society-page.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: refine game management menu"
          git push
