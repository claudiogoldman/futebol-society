name: Fix current UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply UI corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text()
          old = "        {canManage && <button type=\"button\" className=\"sf-admin-toggle\" style={{ marginLeft: 'auto' }} onClick={() => setEditing(true)}>Gestão</button>}\n"
          if old not in s:
              raise SystemExit('Expected Gestão button not found')
          s = s.replace(old, '', 1)
          s = s.replace("Você tá confirmado", "Você está confirmado")
          p.write_text(s)
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/society-page.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove redundant group management button"
          git push
