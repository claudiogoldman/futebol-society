name: Restore Society page

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.sha == 'edca940db63a1922c3126066bf4ecf4224452205'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last known complete Society page
        run: |
          git checkout 1d3c151e133716281366614becdacd010809b138 -- app/society-page.js
          test "$(wc -l < app/society-page.js)" -gt 2000
      - name: Validate build
        run: |
          npm ci
          NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder npm run build
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/society-page.js .github/workflows/restore-society-page.yml
          git commit -m 'fix: restore Society page after broken integration commit'
          git rm .github/workflows/restore-society-page.yml
          git commit -m 'chore: remove one-time Society restore workflow'
          git push origin HEAD:main
