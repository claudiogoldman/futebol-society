name: One-shot GameTeams hooks fix

on:
  push:
    branches:
      - refactor/game-teams-integration

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[game-teams-hooks-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix hook dependencies and roster prop
        shell: python
        run: |
          from pathlib import Path
          p = Path('components/society/GameTeamsSection.js')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace('  roster = activePlayers,\n  activePlayers,', '  roster,\n  activePlayers,', 1)
          s = s.replace('    [activePlayers]\n  );', '    [roster]\n  );', 1)
          if s == old:
              raise SystemExit('Expected hook/roster patterns were not found')
          p.write_text(s, encoding='utf-8')
      - name: Validate and commit
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git add components/society/GameTeamsSection.js
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(game-teams): correct roster prop and hook dependency [game-teams-hooks-fixed]"
          git push origin HEAD:refactor/game-teams-integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
