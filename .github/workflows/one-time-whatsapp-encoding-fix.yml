name: One-time WhatsApp encoding fix
# One-time migration: use the full WhatsApp endpoint to preserve UTF-8 emoji in prefilled messages.
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch WhatsApp links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.js')
          s = p.read_text(encoding='utf-8')
          old1 = "window.open(`https://wa.me/${p.phone}?text=${encodeURIComponent(msg)}`, '_blank');"
          new1 = "window.open(`https://api.whatsapp.com/send/?phone=${p.phone}&text=${encodeURIComponent(msg)}`, '_blank');"
          old2 = "window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');"
          new2 = "window.open(`https://api.whatsapp.com/send/?text=${encodeURIComponent(msg)}`, '_blank');"
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected WhatsApp URL patterns not found; no changes made.')
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify build
        run: |
          npm install
          npm run build
      - name: Commit and remove one-time workflow
        run: |
          rm -f .github/workflows/one-time-whatsapp-encoding-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.js .github/workflows/one-time-whatsapp-encoding-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: preserve WhatsApp message emoji encoding'
          git push
