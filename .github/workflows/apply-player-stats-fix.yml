name: Apply player stats fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python3 scripts/apply-player-stats-fix.py
      - name: Commit patch
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/page.js
            git commit -m 'fix: allow players to report own goals and assists'
            git push origin HEAD:main
          fi
      - name: Remove one-shot patch tooling
        run: |
          rm -f scripts/apply-player-stats-fix.py .github/workflows/apply-player-stats-fix.yml
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'chore: remove one-shot patch tooling'
            git push origin HEAD:main
          fi
