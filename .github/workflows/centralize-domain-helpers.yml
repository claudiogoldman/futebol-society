name: Centralize Domain Helpers

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  centralize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Centralize domain helpers
        run: node scripts/centralize-domain-helpers.js

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key

      - name: Commit centralized page
        run: |
          if git diff --quiet -- app/page.js; then
            echo "page.js already centralized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          git commit -m "refactor: centralize page domain helpers"
          git push
