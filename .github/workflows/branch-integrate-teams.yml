name: Isolated Teams integration

on:
  push:
    branches: [refactor/game-teams-integration]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'refactor(teams): integrate GameTeamsSection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply deterministic extraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text()

          old_import = "import TacticalPitch from '../components/society/TacticalPitch';\n"
          new_import = "import GameTeamsSection from '../components/society/GameTeamsSection';\n"
          assert s.count(old_import) == 1, f'TacticalPitch import count={s.count(old_import)}'
          assert new_import not in s, 'GameTeamsSection already imported'
          s = s.replace(old_import, new_import, 1)

          pitch_fn = "function PitchView({ teamA, teamB, playersPerTeam, reservesPerTeam }) {\n  return (\n    <TacticalPitch\n      teamA={teamA}\n      teamB={teamB}\n      playersPerTeam={playersPerTeam}\n      reservesPerTeam={reservesPerTeam}\n    />\n  );\n}\n"
          assert s.count(pitch_fn) == 1, f'PitchView count={s.count(pitch_fn)}'
          s = s.replace(pitch_fn, '', 1)

          start = '      <section className="sf-card">\n        <div className="sf-card-title"><Shuffle size={16} /> Times</div>'
          end = '      <section className="sf-card">\n        <div className="sf-card-title"><Wallet size={16} /> Rateio</div>'
          assert s.count(start) == 1, f'Times marker count={s.count(start)}'
          i = s.index(start)
          j = s.index(end, i)
          assert j > i

          replacement = '''      <GameTeamsSection
        game={game}
        activePlayers={activePlayers}
        canManage={canManage}
        hasTeams={hasTeams}
        playersPerTeam={playersPerTeam}
        reservesPerTeam={reservesPerTeam}
        editingTeams={editingTeams}
        teamDraft={teamDraft}
        setTeamDraft={setTeamDraft}
        setEditingTeams={setEditingTeams}
        onDraw={onDraw}
        onSaveTeams={onSaveTeams}
        isGoalkeeper={isGoleiro}
      />

'''
          s = s[:i] + replacement + s[j:]

          assert s.count(new_import) == 1
          assert s.count('GameTeamsSection') == 2
          assert 'function PitchView' not in s
          assert 'TacticalPitch' not in s
          p.write_text(s)
          PY
          git diff --check

      - name: Validate
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Commit integration and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/society-page.js .github/workflows/branch-integrate-teams.yml
          git commit -m 'refactor(teams): integrate GameTeamsSection'
          git rm .github/workflows/branch-integrate-teams.yml
          git commit -m 'chore: remove isolated Teams integration workflow'
          git push origin HEAD:refactor/game-teams-integration
