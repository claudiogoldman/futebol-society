name: Wire group default location

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch handler
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/society-page.js'); s=p.read_text()
          old="""  const setGroupDefaultLocation = async (groupId, locationId) => {
    if (locationId) {
      const { error } = await supabase.from('group_locations').update({ is_default: true }).eq('id', locationId).eq('group_id', groupId);
      if (error) { alert('Não foi possível definir o local padrão: ' + error.message); return; }
    } else {
      const { error } = await supabase.from('group_locations').update({ is_default: false }).eq('group_id', groupId);
      if (error) { alert('Não foi possível remover o local padrão: ' + error.message); return; }
    }
    await loadAll();
  };
"""
          new="""  const setGroupDefaultLocation = async (groupId, locationId) => {
    const { error } = await supabase.rpc('set_group_default_location', {
      p_group_id: groupId,
      p_location_id: locationId || null,
    });
    if (error) { alert('Não foi possível definir o local padrão: ' + error.message); return false; }
    await loadAll();
    return true;
  };
"""
          if old not in s: raise SystemExit('group default location handler not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-key
        run: |
          npm ci
          npm run build
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/society-page.js
          git commit -m "fix: use atomic group default location RPC"
          git rm .github/workflows/fix-group-default-location.yml
          git commit -m "chore: remove one-shot location workflow"
          git push origin HEAD:main
