name: Wire profile nickname display

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: wire profile nickname display'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply nickname display rule
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/society-page.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              "const POSITION_ORDER = ['goleiro', 'fixo', 'libero', 'meio', 'ala_esquerdo', 'ala_direito', 'pivo'];\n",
              "const POSITION_ORDER = ['goleiro', 'fixo', 'libero', 'meio', 'ala_esquerdo', 'ala_direito', 'pivo'];\n\nfunction displayName(player) {\n  const nickname = typeof player?.nickname === 'string' ? player.nickname.trim() : '';\n  return nickname || player?.name || '?';\n}\n",
            ),
            (
              "const firstName = (player.name || '?').trim().split(' ')[0];",
              "const firstName = displayName(player).trim().split(' ')[0];",
            ),
            (
              "{(p.name || '?').trim().slice(0, 2).toUpperCase()}",
              "{displayName(p).trim().slice(0, 2).toUpperCase()}",
            ),
            (
              "const profs = profilesRes.data || [];",
              "const profs = (profilesRes.data || []).map((p) => ({ ...p, accountName: p.name, name: displayName(p) }));",
            ),
            (
              "  const [weightDraft, setWeightDraft] = useState(me.weight_kg || '');\n",
              "  const [weightDraft, setWeightDraft] = useState(me.weight_kg || '');\n  const [nicknameDraft, setNicknameDraft] = useState(me.nickname || '');\n",
            ),
            (
              "      <div className=\"sf-h3\">{me.name} <span className=\"sf-me-tag\">você</span></div>\n",
              "      <div className=\"sf-h3\">{me.name} <span className=\"sf-me-tag\">você</span></div>\n      <div className=\"sf-muted-sm\" style={{ margin: '12px 0 6px' }}>Apelido / como você quer ser chamado</div>\n      <input\n        type=\"text\" className=\"sf-input\" maxLength={40} placeholder={me.accountName || 'Seu nome'}\n        value={nicknameDraft}\n        onChange={(e) => setNicknameDraft(e.target.value)}\n        onBlur={() => onUpdate({ nickname: nicknameDraft.trim() || null })}\n      />\n      <div className=\"sf-muted-sm\" style={{ marginTop: 4 }}>Se preencher, este nome aparecerá no elenco, grupos, partidas, times, ranking e chat. Se deixar vazio, será usado seu nome da conta Google.</div>\n",
            ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit patched application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/society-page.js
          git diff --cached --check
          git commit -m "chore: wire profile nickname display"
          git push
