name: One-shot Society image upload refactor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Society page
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app/society-page.js';
          let page = fs.readFileSync(path, 'utf8');

          const oldImport = "import { addGameParticipant, removeGameParticipant, toggleGameWaitlist, setGameCost, setGameGoalkeeperPays, setGamePixDetails as serviceSetGamePixDetails, setGameOrganizer as serviceSetGameOrganizer, setGameLocation as serviceSetGameLocation, setGameMaxPlayers, setGameTeams, setGamePayment, setPlayerStats, setGameResult, setGameGoals, setGameRatings, createGame as serviceCreateGame, deleteGame as serviceDeleteGame, confirmOrganizer as serviceConfirmOrganizer, createGroup as serviceCreateGroup, addGroupMember as serviceAddGroupMember, createGroupLocation as serviceCreateGroupLocation, updateGroupLocation as serviceUpdateGroupLocation, deleteGroupLocation as serviceDeleteGroupLocation, setGroupDefaultLocation as serviceSetGroupDefaultLocation, setGroupDefaults as serviceSetGroupDefaults, leaveGroup as serviceLeaveGroup, removeGroupMember as serviceRemoveGroupMember, deleteGroup as serviceDeleteGroup, addGameGuest as serviceAddGameGuest, joinGameByToken as serviceJoinGameByToken, joinGroupByToken as serviceJoinGroupByToken, updateMyProfile as serviceUpdateMyProfile, setAdmin as serviceSetAdmin } from '../lib/services/society-service';";
          const newImport = "import { addGameParticipant, removeGameParticipant, toggleGameWaitlist, setGameCost, setGameGoalkeeperPays, setGamePixDetails as serviceSetGamePixDetails, setGameOrganizer as serviceSetGameOrganizer, setGameLocation as serviceSetGameLocation, setGameMaxPlayers, setGameTeams, setGamePayment, setPlayerStats, setGameResult, setGameGoals, setGameRatings, createGame as serviceCreateGame, deleteGame as serviceDeleteGame, confirmOrganizer as serviceConfirmOrganizer, createGroup as serviceCreateGroup, addGroupMember as serviceAddGroupMember, createGroupLocation as serviceCreateGroupLocation, updateGroupLocation as serviceUpdateGroupLocation, deleteGroupLocation as serviceDeleteGroupLocation, setGroupDefaultLocation as serviceSetGroupDefaultLocation, setGroupDefaults as serviceSetGroupDefaults, leaveGroup as serviceLeaveGroup, removeGroupMember as serviceRemoveGroupMember, deleteGroup as serviceDeleteGroup, addGameGuest as serviceAddGameGuest, joinGameByToken as serviceJoinGameByToken, joinGroupByToken as serviceJoinGroupByToken, updateMyProfile as serviceUpdateMyProfile, setAdmin as serviceSetAdmin, uploadProfileAvatar as serviceUploadProfileAvatar, uploadGroupImage as serviceUploadGroupImage } from '../lib/services/society-service';";
          if (!page.includes(oldImport)) throw new Error('Expected Society service import not found');
          page = page.replace(oldImport, newImport);

          const profileUpload = /const ext = \(file\.name\.split\('\.'\)\.pop\(\) \|\| 'jpg'\)\.toLowerCase\(\);[\s\S]*?onUpdate\(\{ avatar_url: `\$\{data\.publicUrl\}\?t=\$\{Date\.now\(\)\}` \}\);/;
          if (!profileUpload.test(page)) throw new Error('Expected profile avatar upload block not found');
          page = page.replace(profileUpload, `const { data, error } = await serviceUploadProfileAvatar(me.id, file);\n      if (error) throw error;\n      onUpdate({ avatar_url: \`${'${data.publicUrl}'}?t=\${Date.now()}\` });`);

          const groupUpload = /const safeName = \(file\.name \|\| 'grupo'\)\.replace\(\/\[\^a-zA-Z0-9\._-\]\/g, '-'\);[\s\S]*?setAvatarDraft\(null\);/;
          if (!groupUpload.test(page)) throw new Error('Expected group image upload block not found');
          page = page.replace(groupUpload, `const { data, error } = await serviceUploadGroupImage(group.id, myId, file);\n      if (error) throw error;\n      setAvatarUrlDraft(data.publicUrl);\n      setAvatarDraft(null);`);

          fs.writeFileSync(path, page);
          NODE

      - name: Verify no direct storage mutations remain
        run: |
          if grep -nE "supabase\.storage\.from\('(avatars|group-images)'\)\.(upload|getPublicUrl)" app/society-page.js; then
            echo "Direct storage mutation remains in Society page"
            exit 1
          fi

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-placeholder
        run: npm run build

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/society-page.js lib/services/society-service.js
          git diff --cached --check
          git commit -m "refactor: wire Society image uploads to service layer" || exit 0
          git push origin HEAD:main
