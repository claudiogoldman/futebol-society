name: Fix group defaults in new game

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-group-defaults-in-new-game.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch new-game group inheritance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/page.js')
          text = path.read_text(encoding='utf-8')

          pattern = r'''onChange=\{\(e\) => \{\n\s*const gid = e\.target\.value \|\| null;\n\s*setNewGameGroupId\(gid\);\n\s*const g = groups\.find\(\(gr\) => gr\.id === gid\);\n\s*if \(g\) \{.*?\n\s*\}\n\s*\}\}'''

          replacement = '''onChange={(e) => {
                    const gid = e.target.value || null;
                    setNewGameGroupId(gid);
                    const g = groups.find((gr) => gr.id === gid);
                    if (g) {
                      // Selecting a group must inherit every group default.
                      // The fields remain editable for this specific game.
                      setNewDate(nextDateForWeekday(g.defaultDayOfWeek));
                      setNewLocal(g.defaultLocal || '');
                      setNewMaxPlayers(g.defaultMaxPlayers ? String(g.defaultMaxPlayers) : '');
                      setNewGameCost(g.defaultCost != null ? String(g.defaultCost) : '');
                      setNewGameGoalkeeperPays(g.defaultGoalkeeperPays !== false);
                      setNewGamePixKey(g.defaultPixKey || '');
                      setNewGamePixReceiverName(g.defaultPixReceiverName || '');
                      setNewGamePixCity(g.defaultPixCity || '');
                    } else {
                      setNewDate('');
                      setNewLocal('');
                      setNewMaxPlayers('');
                      setNewGameCost('');
                      setNewGameGoalkeeperPays(true);
                      setNewGamePixKey('');
                      setNewGamePixReceiverName('');
                      setNewGamePixCity('');
                    }
                  }}'''

          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Target new-game group selector handler not found; aborting without changes')

          path.write_text(updated, encoding='utf-8')
          print('Patched app/page.js successfully')
          PY

      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.js
          git commit -m 'fix: inherit all group defaults in new game' || exit 0
          git push
          rm -f .github/workflows/fix-group-defaults-in-new-game.yml
          git add -u .github/workflows/fix-group-defaults-in-new-game.yml
          git commit -m 'chore: remove one-time group defaults workflow' || true
          git push || true
