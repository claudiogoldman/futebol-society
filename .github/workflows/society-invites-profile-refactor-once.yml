name: One-shot Society invites profile refactor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Society page
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app/society-page.js';
          let page = fs.readFileSync(path, 'utf8');

          const oldImport = "import { addGameParticipant, removeGameParticipant, toggleGameWaitlist, setGameCost, setGameGoalkeeperPays, setGamePixDetails as serviceSetGamePixDetails, setGameOrganizer as serviceSetGameOrganizer, setGameLocation as serviceSetGameLocation, setGameMaxPlayers, setGameTeams, setGamePayment, setPlayerStats, setGameResult, setGameGoals, setGameRatings, createGame as serviceCreateGame, deleteGame as serviceDeleteGame, confirmOrganizer as serviceConfirmOrganizer, createGroup as serviceCreateGroup, addGroupMember as serviceAddGroupMember, createGroupLocation as serviceCreateGroupLocation, updateGroupLocation as serviceUpdateGroupLocation, deleteGroupLocation as serviceDeleteGroupLocation, setGroupDefaultLocation as serviceSetGroupDefaultLocation, setGroupDefaults as serviceSetGroupDefaults, leaveGroup as serviceLeaveGroup, removeGroupMember as serviceRemoveGroupMember, deleteGroup as serviceDeleteGroup } from '../lib/services/society-service';";
          const newImport = "import { addGameParticipant, removeGameParticipant, toggleGameWaitlist, setGameCost, setGameGoalkeeperPays, setGamePixDetails as serviceSetGamePixDetails, setGameOrganizer as serviceSetGameOrganizer, setGameLocation as serviceSetGameLocation, setGameMaxPlayers, setGameTeams, setGamePayment, setPlayerStats, setGameResult, setGameGoals, setGameRatings, createGame as serviceCreateGame, deleteGame as serviceDeleteGame, confirmOrganizer as serviceConfirmOrganizer, createGroup as serviceCreateGroup, addGroupMember as serviceAddGroupMember, createGroupLocation as serviceCreateGroupLocation, updateGroupLocation as serviceUpdateGroupLocation, deleteGroupLocation as serviceDeleteGroupLocation, setGroupDefaultLocation as serviceSetGroupDefaultLocation, setGroupDefaults as serviceSetGroupDefaults, leaveGroup as serviceLeaveGroup, removeGroupMember as serviceRemoveGroupMember, deleteGroup as serviceDeleteGroup, addGameGuest as serviceAddGameGuest, joinGameByToken as serviceJoinGameByToken, joinGroupByToken as serviceJoinGroupByToken, updateMyProfile as serviceUpdateMyProfile, setAdmin as serviceSetAdmin } from '../lib/services/society-service';";
          if (!page.includes(oldImport)) throw new Error('Expected Society service import not found');
          page = page.replace(oldImport, newImport);

          const oldGameInvite = "const { data: gameId } = await supabase.rpc('join_game_by_token', { p_token: token });";
          const oldGroupInvite = "const { data: groupId } = await supabase.rpc('join_group_by_token', { p_token: groupToken });";
          if (!page.includes(oldGameInvite) || !page.includes(oldGroupInvite)) throw new Error('Expected invite RPCs not found');
          page = page.replace(oldGameInvite, "const { data: gameId } = await serviceJoinGameByToken(token);");
          page = page.replace(oldGroupInvite, "const { data: groupId } = await serviceJoinGroupByToken(groupToken);");

          const guest = /const addGuest = async \(gameId, name, email, position\) => \{[\s\S]*?\n  \};/;
          if (!guest.test(page)) throw new Error('Expected addGuest handler not found');
          page = page.replace(guest, `const addGuest = async (gameId, name, email, position) => {\n    const { error } = await serviceAddGameGuest(gameId, name, email, position);\n    if (error) { alert('Não foi possível adicionar o convidado: ' + error.message); return false; }\n    await loadAll();\n    return true;\n  };`);

          const profile = /const updateMyProfile = async \(fields\) => \{[\s\S]*?\n  \};/;
          if (!profile.test(page)) throw new Error('Expected updateMyProfile handler not found');
          page = page.replace(profile, `const updateMyProfile = async (fields) => {\n    const { error } = await serviceUpdateMyProfile(myId, fields);\n    if (error) { alert('Não foi possível salvar seu perfil: ' + error.message); return false; }\n    await loadAll();\n    return true;\n  };`);

          const admin = /const toggleAdmin = async \(userId, isAdmin\) => \{[\s\S]*?\n  \};/;
          if (!admin.test(page)) throw new Error('Expected toggleAdmin handler not found');
          page = page.replace(admin, `const toggleAdmin = async (userId, isAdmin) => {\n    const { error } = await serviceSetAdmin(userId, isAdmin);\n    if (error) { alert('Não foi possível alterar a administração: ' + error.message); return false; }\n    await loadAll();\n    return true;\n  };`);

          fs.writeFileSync(path, page);
          NODE

      - name: Verify no direct invite/guest/profile/admin mutations remain
        run: |
          if grep -nE "supabase\.rpc\('(join_game_by_token|join_group_by_token|add_game_guest)'|supabase\.from\('profiles'\)\.(insert|update|delete)" app/society-page.js; then
            echo "Direct invite/guest/profile/admin mutation remains in Society page"
            exit 1
          fi

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-placeholder
        run: npm run build

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/society-page.js
          git diff --cached --check
          git commit -m "refactor: wire Society invites and profile mutations to service layer" || exit 0
          git push origin HEAD:main
