name: One-shot Society stats refactor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch service imports and stats mutations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app/society-page.js';
          let s = fs.readFileSync(path, 'utf8');

          const oldImport = "import { addGameParticipant, removeGameParticipant, toggleGameWaitlist, setGameCost, setGameGoalkeeperPays, setGamePixDetails as serviceSetGamePixDetails, setGameOrganizer as serviceSetGameOrganizer, setGameLocation as serviceSetGameLocation, setGameMaxPlayers, setGameTeams } from '../lib/services/society-service';";
          const newImport = "import { addGameParticipant, removeGameParticipant, toggleGameWaitlist, setGameCost, setGameGoalkeeperPays, setGamePixDetails as serviceSetGamePixDetails, setGameOrganizer as serviceSetGameOrganizer, setGameLocation as serviceSetGameLocation, setGameMaxPlayers, setGameTeams, setGamePayment, setPlayerStats, setGameResult, setGameGoals, setGameRatings } from '../lib/services/society-service';";
          if (!s.includes(oldImport)) throw new Error('Expected Society service import not found');
          s = s.replace(oldImport, newImport);

          const replacements = [
            [
              "const { error } = await supabase.from('payments').upsert({ game_id: gameId, user_id: userId, paid });",
              "const { error } = await setGamePayment(gameId, userId, paid);"
            ],
            [
              "const { error } = await supabase.from('goals').upsert({\n      game_id: gameId,\n      user_id: userId,\n      goals: safeGoals,\n      assists: safeAssists,\n    });",
              "const { error } = await setPlayerStats(gameId, userId, safeGoals, safeAssists);"
            ],
            [
              "const { error: resultError } = await supabase.from('games').update({ score_a: scoreA, score_b: scoreB }).eq('id', gameId);",
              "const { error: resultError } = await setGameResult(gameId, scoreA, scoreB);"
            ],
            [
              "const { error: goalsError } = await supabase.from('goals').upsert(rows);",
              "const { error: goalsError } = await setGameGoals(gameId, rows);"
            ],
            [
              "const { error } = await supabase.from('ratings').upsert(rows);",
              "const { error } = await setGameRatings(rows);"
            ],
          ];

          for (const [from, to] of replacements) {
            if (!s.includes(from)) throw new Error('Expected mutation block not found:\n' + from);
            s = s.replace(from, to);
          }

          fs.writeFileSync(path, s);
          NODE

      - name: Verify no direct stats mutations remain in handlers
        run: |
          grep -n "from('payments').upsert\|from('goals').upsert\|from('ratings').upsert\|from('games').update({ score_a" app/society-page.js || true
          git diff --check
          git diff -- app/society-page.js

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
        run: npm run build

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/society-page.js
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "refactor: wire Society stats mutations to service layer"
          git push origin main
