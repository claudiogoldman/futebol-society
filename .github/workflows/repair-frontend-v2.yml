name: Repair frontend v2

on:
  push:
    paths:
      - .github/workflows/repair-frontend-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair frontend
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text()
          changed = False

          bad = "const { error } = const aStarters"
          if bad in s:
              start = s.index("    const { error } = const aStarters")
              end = s.index("    if (error) { alert('Não foi possível salvar os times: ' + error.message); return false; }", start) + len("    if (error) { alert('Não foi possível salvar os times: ' + error.message); return false; }")
              replacement = """    const aStarters = activePlayers.filter((p) => teamDraft[p.id] === 'A' && p._teamRole !== 'reserve').map((p) => p.id);
              const bStarters = activePlayers.filter((p) => teamDraft[p.id] === 'B' && p._teamRole !== 'reserve').map((p) => p.id);
              const aReserves = activePlayers.filter((p) => teamDraft[p.id] === 'A' && p._teamRole === 'reserve').map((p) => p.id);
              const bReserves = activePlayers.filter((p) => teamDraft[p.id] === 'B' && p._teamRole === 'reserve').map((p) => p.id);
              const { error } = await setGameTeams(gameId, aStarters, bStarters, aReserves, bReserves);
              if (error) { alert('Não foi possível salvar os times: ' + error.message); return false; }"""
              s = s[:start] + replacement + s[end:]
              changed = True

          if "const handleDraw = async (gameId, confirmedPlayers) => {\n    const { teamA" in s and "const game = games.find((g) => g.id === gameId);" not in s[s.index("const handleDraw = async"):s.index("const handleDraw = async")+500]:
              needle = "  const handleDraw = async (gameId, confirmedPlayers) => {\n"
              s = s.replace(needle, needle + "    const game = games.find((g) => g.id === gameId);\n    if (!game) { alert('Partida não encontrada.'); return false; }\n", 1)
              changed = True

          # Current team loader must preserve starter/reserve role from game_teams.
          old = "const teamA = teamRows.filter((t) => t.team === 'A').map((t) => profileMap[t.user_id]).filter(Boolean);"
          new = "const teamA = teamRows.filter((t) => t.team === 'A').map((t) => { const p = profileMap[t.user_id]; return p ? { ...p, _teamRole: t.role || 'starter' } : null; }).filter(Boolean);"
          if old in s:
              s = s.replace(old, new, 1); changed = True
          old = "const teamB = teamRows.filter((t) => t.team === 'B').map((t) => profileMap[t.user_id]).filter(Boolean);"
          new = "const teamB = teamRows.filter((t) => t.team === 'B').map((t) => { const p = profileMap[t.user_id]; return p ? { ...p, _teamRole: t.role || 'starter' } : null; }).filter(Boolean);"
          if old in s:
              s = s.replace(old, new, 1); changed = True

          if "onSetTeamConfig=" not in s:
              anchor = "            onSetMaxPlayers={setMaxPlayers}\n            onDraw={handleDraw}"
              if anchor in s:
                  s = s.replace(anchor, "            onSetMaxPlayers={setMaxPlayers}\n            onSetTeamConfig={async (gameId, playersPerTeam, reservesPerTeam) => {\n              const { error } = await setGameTeamConfig(gameId, playersPerTeam, reservesPerTeam);\n              if (error) { alert('Não foi possível alterar o formato da partida: ' + error.message); return false; }\n              await loadAll();\n              return true;\n            }}\n            onDraw={handleDraw}", 1); changed = True

          if "bad" in s:
              raise SystemExit('corruption remains')
          p.write_text(s)
          print('changed=', changed)
