name: Apply UI enhancements

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-ui-enhancements.py'
      - 'lib/nationality.js'
      - '.github/workflows/apply-ui-enhancements.yml'
  pull_request:
    paths:
      - 'scripts/apply-ui-enhancements.py'
      - 'lib/nationality.js'
      - '.github/workflows/apply-ui-enhancements.yml'
      - 'scripts/trigger-ui-enhancements'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply deterministic patch
        run: python scripts/apply-ui-enhancements.py
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Commit generated application changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.js
          git diff --cached --quiet || git commit -m 'feat: complete group, pix and participant UI'
          git push
