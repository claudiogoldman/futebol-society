name: One-shot Society helper extraction

on:
  push:
    branches: [main]
    paths:
      - 'lib/ui/society-formatters.js'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire presentation helpers into Society page
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/society-page.js')
          text = path.read_text(encoding='utf-8')

          import_line = "import { formatDatePtBr, WEEKDAY_LABELS, nextDateForWeekday, money, gameLocationQuery, gameMapUrls } from '../lib/ui/society-formatters';"
          anchor = "import { averageRatingFor as avgRatingFor, computeGameHighlights as computeGameDestaques, computeRanking } from '../lib/domain/ranking';\n"
          if import_line not in text:
              text = text.replace(anchor, anchor + import_line + "\n", 1)

          start = text.index('// next upcoming date (yyyy-mm-dd) that falls on the given weekday (0=Sun..6=Sat)')
          end_marker = '// ---------- pix "copia e cola" generator (BR Code / EMV standard, no gateway needed) ----------'
          end = text.index(end_marker, start)
          block = text[start:end]
          expected = [
              'function formatDatePtBr(',
              'const WEEKDAY_LABELS =',
              'function nextDateForWeekday(',
              'function money(',
              'function gameLocationQuery(',
              'function gameMapUrls(',
          ]
          if all(marker in text for marker in expected):
              # The formatDatePtBr declaration starts before the located range.
              helper_start = text.rfind('function formatDatePtBr(', 0, start)
              if helper_start < 0:
                  raise SystemExit('Could not locate formatter block start')
              text = text[:helper_start] + text[end:]

          path.write_text(text, encoding='utf-8')
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/society-page.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: wire Society presentation helpers'
          git push
