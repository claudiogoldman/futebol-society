name: Production Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production-smoke:
    name: Playwright — produção
    if: github.event.head_commit.message != 'refactor(teams): integrate GameTeamsSection'
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integrate GameTeamsSection deterministically
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text()
          old_import = "import TacticalPitch from '../components/society/TacticalPitch';\n"
          new_import = "import GameTeamsSection from '../components/society/GameTeamsSection';\n"
          assert s.count(old_import) == 1, f'unexpected TacticalPitch import count: {s.count(old_import)}'
          assert s.count(new_import) == 0, f'GameTeamsSection already imported: {s.count(new_import)}'
          s = s.replace(old_import, new_import, 1)
          pitch_fn = "function PitchView({ teamA, teamB, playersPerTeam, reservesPerTeam }) {\n  return (\n    <TacticalPitch\n      teamA={teamA}\n      teamB={teamB}\n      playersPerTeam={playersPerTeam}\n      reservesPerTeam={reservesPerTeam}\n    />\n  );\n}\n"
          assert s.count(pitch_fn) == 1, f'unexpected PitchView count: {s.count(pitch_fn)}'
          s = s.replace(pitch_fn, '', 1)
          start = '      <section className="sf-card">\n        <div className="sf-card-title"><Shuffle size={16} /> Times</div>'
          end = '      <section className="sf-card">\n        <div className="sf-card-title"><Wallet size={16} /> Rateio</div>'
          assert s.count(start) == 1, f'unexpected Times marker count: {s.count(start)}'
          i = s.index(start)
          j = s.index(end, i)
          replacement = '''      <GameTeamsSection
        game={game}
        activePlayers={activePlayers}
        canManage={canManage}
        hasTeams={hasTeams}
        playersPerTeam={playersPerTeam}
        reservesPerTeam={reservesPerTeam}
        editingTeams={editingTeams}
        teamDraft={teamDraft}
        setTeamDraft={setTeamDraft}
        setEditingTeams={setEditingTeams}
        onDraw={onDraw}
        onSaveTeams={onSaveTeams}
        isGoalkeeper={isGoleiro}
      />

'''
          s = s[:i] + replacement + s[j:]
          assert s.count(new_import) == 1, f'import count after integration: {s.count(new_import)}'
          assert s.count('GameTeamsSection') == 2, f'component reference count after integration: {s.count("GameTeamsSection")}'
          assert 'function PitchView' not in s
          assert 'TacticalPitch' not in s
          p.write_text(s)
          print('Deterministic Teams integration prepared successfully.')
          PY
          git diff --check

      - name: Validate refactor
        run: |
          npm test
          npm run build

      - name: Run production smoke tests
        run: npx playwright test
        env:
          CI: 'true'
          PLAYWRIGHT_TEST_BASE_URL: https://futebol-society-app.vercel.app
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-production-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Commit integration and restore workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/society-page.js .github/workflows/playwright-production.yml
          git commit -m 'refactor(teams): integrate GameTeamsSection'
          git restore --source=HEAD^ -- .github/workflows/playwright-production.yml
          git add .github/workflows/playwright-production.yml
          git commit --amend --no-edit
          git push
