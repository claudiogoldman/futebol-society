name: Production Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production-smoke:
    name: Playwright — produção
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: One-shot player UX refinement
        shell: bash
        run: |
          if [ -f scripts/one-shot-player-ux.py ]; then
            python3 scripts/one-shot-player-ux.py
            rm -f scripts/one-shot-player-ux.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/society-page.js scripts/one-shot-player-ux.py
            git commit -m "feat: improve player profile and match roster UX [player-ux]"
            git push
          else
            echo "Player UX refinement already applied; skipping one-shot patch."
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke tests
        run: npx playwright test
        env:
          CI: 'true'
          PLAYWRIGHT_TEST_BASE_URL: https://futebol-society-app.vercel.app
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-production-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
