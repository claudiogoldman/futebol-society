name: Production Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production-smoke:
    name: Playwright — produção
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply location management fix
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, 'fix: restore location management')
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text()
          replacements = [
            ("  const [locationDraft, setLocationDraft] = useState({ name: '', address: '', city: '', state: '', latitude: '', longitude: '', isDefault: false });\n", "  const [locationDraft, setLocationDraft] = useState({ name: '', address: '', city: '', state: '', latitude: '', longitude: '', isDefault: false });\n  const [editingLocationId, setEditingLocationId] = useState(null);\n"),
            ("    setCostDraft(group.defaultCost != null ? String(group.defaultCost) : '');\n", "    setCostDraft(group.defaultCost != null ? String(group.defaultCost) : '');\n    setEditingLocationId(null);\n"),
            ('''        {canManage && <button type="button" className="sf-admin-toggle" style={{ marginLeft: 'auto' }} onClick={() => onDeleteLocation(loc.id)}>Excluir</button>}''', '''        {canManage && <div style={{ marginLeft: 'auto', display: 'flex', gap: 6 }}>
                <button type="button" className="sf-admin-toggle" onClick={() => { setEditingLocationId(loc.id); setLocationDraft({ name: loc.name || '', address: loc.address || '', city: loc.city || '', state: loc.state || '', latitude: loc.latitude != null ? String(loc.latitude) : '', longitude: loc.longitude != null ? String(loc.longitude) : '', isDefault: !!loc.is_default }); setLocationModalOpen(true); }}>Editar</button>
                <button type="button" className="sf-admin-toggle" onClick={() => onDeleteLocation(loc.id)}>Excluir</button>
              </div>}'''),
            ('<div className="sf-modal-title">Cadastrar novo local</div>', "<div className=\"sf-modal-title\">{editingLocationId ? 'Editar local' : 'Cadastrar novo local'}</div>"),
            ('''<button type="button" className="sf-btn-ghost" onClick={() => setLocationModalOpen(false)}>Cancelar</button>
                    <button type="button" className="sf-btn-primary" onClick={async () => { if (!locationDraft.name.trim()) return alert('Informe o nome do local.'); const ok = await onCreateLocation(group.id, locationDraft); if (ok) { setLocationDraft({ name: '', address: '', city: '', state: '', latitude: '', longitude: '', isDefault: false }); setLocationModalOpen(false); } }}>Cadastrar local</button>''', '''<button type="button" className="sf-btn-ghost" onClick={() => { setLocationModalOpen(false); setEditingLocationId(null); }}>Cancelar</button>
                    <button type="button" className="sf-btn-primary" onClick={async () => { if (!locationDraft.name.trim()) return alert('Informe o nome do local.'); const ok = editingLocationId ? await onUpdateLocation(group.id, editingLocationId, locationDraft) : await onCreateLocation(group.id, locationDraft); if (ok) { setLocationDraft({ name: '', address: '', city: '', state: '', latitude: '', longitude: '', isDefault: false }); setLocationModalOpen(false); setEditingLocationId(null); } }}>{editingLocationId ? 'Salvar alterações' : 'Cadastrar local'}</button>'''),
            ("function GroupDetail({ group, games, members, myId, onBack, onSetDefaults, onSetDefaultLocation, onShare, onNewGame, onOpenGame, onLeave, onDelete, onRemoveMember, onCreateLocation, onDeleteLocation }) {", "function GroupDetail({ group, games, members, myId, onBack, onSetDefaults, onSetDefaultLocation, onShare, onNewGame, onOpenGame, onLeave, onDelete, onRemoveMember, onCreateLocation, onUpdateLocation, onDeleteLocation }) {"),
            ('''        {isOwner && (
          <button className="sf-icon-btn sf-danger"''', '''        {canManage && <button type="button" className="sf-admin-toggle" style={{ marginLeft: 'auto' }} onClick={() => setEditing(true)}>Gestão</button>}
        {isOwner && (
          <button className="sf-icon-btn sf-danger"'''),
            ('''  const setGroupDefaultLocation = async (groupId, locationId) => {
    if (locationId) {
      const { error } = await supabase.from('group_locations').update({ is_default: true }).eq('id', locationId).eq('group_id', groupId);
      if (error) { alert('Não foi possível definir o local padrão: ' + error.message); return; }
    } else {
      const { error } = await supabase.from('group_locations').update({ is_default: false }).eq('group_id', groupId);
      if (error) { alert('Não foi possível remover o local padrão: ' + error.message); return; }
    }
    await loadAll();
  };''', '''  const setGroupDefaultLocation = async (groupId, locationId) => {
    const { error } = await supabase.rpc('set_group_default_location', { p_group_id: groupId, p_location_id: locationId || null });
    if (error) { alert('Não foi possível definir o local padrão: ' + error.message); return false; }
    await loadAll();
    return true;
  };

  const updateGroupLocation = async (groupId, locationId, draft) => {
    const { error } = await supabase.from('group_locations').update({ name: draft.name.trim(), address: draft.address.trim() || null, city: draft.city.trim() || null, state: draft.state.trim().toUpperCase() || null, latitude: draft.latitude === '' ? null : Number(draft.latitude), longitude: draft.longitude === '' ? null : Number(draft.longitude) }).eq('id', locationId).eq('group_id', groupId);
    if (error) { alert('Não foi possível editar o local: ' + error.message); return false; }
    if (draft.isDefault) {
      const ok = await setGroupDefaultLocation(groupId, locationId);
      if (!ok) return false;
    }
    await loadAll();
    return true;
  };'''),
            ('''            onCreateLocation={createGroupLocation}
            onDeleteLocation={deleteGroupLocation}''', '''            onCreateLocation={createGroupLocation}
            onUpdateLocation={updateGroupLocation}
            onDeleteLocation={deleteGroupLocation}'''),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('PATCH TARGET NOT FOUND: ' + old[:120])
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/society-page.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore location management'
          git push

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke tests
        run: npx playwright test
        env:
          CI: 'true'
          PLAYWRIGHT_TEST_BASE_URL: https://futebol-society-app.vercel.app
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-production-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
