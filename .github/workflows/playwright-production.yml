name: Production Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production-smoke:
    name: Playwright — produção
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production smoke tests
        run: npx playwright test
        env:
          CI: 'true'
          PLAYWRIGHT_TEST_BASE_URL: https://futebol-society-app.vercel.app
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-production-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
  patch-draw-history-ui:
    if: github.event_name == 'push' && github.event.head_commit.message == 'chore: trigger draw history UI patch v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch match page safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text()
          old = "import TacticalPitch from '../components/society/TacticalPitch';"
          assert old in s and "../components/society/DrawHistory" not in s
          s = s.replace(old, old + "\nimport DrawHistory from '../components/society/DrawHistory';", 1)
          old = "setGameTeams, setGamePayment, setPlayerStats"
          assert old in s
          s = s.replace(old, "setGameTeams, getGameDrawHistory, setValidGameDraw, setGamePayment, setPlayerStats", 1)
          old = "  const playerNames = useMemo(() => Object.fromEntries([...activePlayers, ...waitlistPlayers].map((p) => [p.id, displayName(p)])), [activePlayers, waitlistPlayers]);"
          assert old in s
          addition = """
          const [drawHistory, setDrawHistory] = useState([]);
          const [drawHistoryLoading, setDrawHistoryLoading] = useState(false);
          const [drawRestoring, setDrawRestoring] = useState(false);
          const refreshDrawHistory = useCallback(async () => {
            setDrawHistoryLoading(true);
            try { const { data, error } = await getGameDrawHistory(game.id); if (!error) setDrawHistory(data || []); }
            finally { setDrawHistoryLoading(false); }
          }, [game.id]);
          useEffect(() => { refreshDrawHistory(); }, [refreshDrawHistory]);
          const handleDraw = async () => { const ok = await onDraw(game.id, activePlayers); if (ok !== false) await refreshDrawHistory(); };
          const handleRestoreDraw = async (drawId) => {
            if (drawRestoring) return;
            setDrawRestoring(true);
            try { const { error } = await setValidGameDraw(game.id, drawId); if (error) throw error; await refreshDrawHistory(); window.location.reload(); }
            catch (error) { window.alert(error?.message || 'Não foi possível recuperar o sorteio.'); }
            finally { setDrawRestoring(false); }
          };
          """
          s = s.replace(old, old + addition, 1)
          old = "onClick={() => onDraw(game.id, activePlayers)}"
          assert old in s
          s = s.replace(old, "onClick={handleDraw}", 1)
          marker = "      {hasTeams && canRecordResult && ("
          assert marker in s
          s = s.replace(marker, "      <DrawHistory history={drawHistory} roster={roster} canManage={canManage && !drawHistoryLoading && !drawRestoring} onRestore={handleRestoreDraw} />\n\n" + marker, 1)
          p.write_text(s)
          PY
          test $(wc -l < app/society-page.js) -gt 2000
          grep -q "<DrawHistory" app/society-page.js
      - name: Commit UI integration and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/society-page.js
          git commit -m 'feat(draw-history): integrate match history UI'
          git rm .github/workflows/one-shot-draw-history-ui.yml .github/workflows/game-domain-tests.yml docs/draw-history-ui-trigger.md .github/workflows/playwright-production.yml
          git commit -m 'chore: remove temporary draw history patchers'
          git push
