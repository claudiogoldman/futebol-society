name: Production Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  production-smoke:
    name: Playwright — produção
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke tests
        run: npx playwright test
        env:
          CI: 'true'
          PLAYWRIGHT_TEST_BASE_URL: https://futebol-society-app.vercel.app
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-production-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  one-shot-teams-refactor:
    name: Extract Teams section
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Teams section safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text()
          assert len(s) > 150000, f'unexpected page size: {len(s)}'
          imp = "import TacticalPitch from '../components/society/TacticalPitch';\n"
          assert s.count(imp) == 1, 'TacticalPitch import count mismatch'
          s = s.replace(imp, '', 1)
          pitch = "function PitchView({ teamA, teamB, playersPerTeam, reservesPerTeam }) {\n  return (\n    <TacticalPitch\n      teamA={teamA}\n      teamB={teamB}\n      playersPerTeam={playersPerTeam}\n      reservesPerTeam={reservesPerTeam}\n    />\n  );\n}\n"
          assert s.count(pitch) == 1, 'PitchView block mismatch'
          s = s.replace(pitch, '', 1)
          start_marker = '      <section className="sf-card">\n        <div className="sf-card-title"><Shuffle size={16} /> Times</div>'
          end_marker = '      <section className="sf-card">\n        <div className="sf-card-title"><Wallet size={16} /> Rateio</div>'
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          replacement = '''      <GameTeamsSection
        game={game}
        activePlayers={activePlayers}
        canManage={canManage}
        hasTeams={hasTeams}
        playersPerTeam={playersPerTeam}
        reservesPerTeam={reservesPerTeam}
        editingTeams={editingTeams}
        teamDraft={teamDraft}
        setTeamDraft={setTeamDraft}
        setEditingTeams={setEditingTeams}
        onDraw={onDraw}
        onSaveTeams={onSaveTeams}
        isGoalkeeper={isGoleiro}
      />\n\n'''
          s = s[:start] + replacement + s[end:]
          marker = "import GameChat from '../components/chat/GameChat';\n"
          assert marker in s
          assert "import GameTeamsSection from '../components/society/GameTeamsSection';" not in s
          s = s.replace(marker, marker + "import GameTeamsSection from '../components/society/GameTeamsSection';\n", 1)
          p.write_text(s)
          assert len(s) > 140000
          assert s.count('GameTeamsSection') == 2
          assert 'function PitchView' not in s
          assert "TacticalPitch from '../components/society/TacticalPitch'" not in s
          PY
          git diff --check
          test $(wc -l < app/society-page.js) -gt 1800

      - name: Validate refactor
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit refactor and restore workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/society-page.js
          git commit -m 'refactor(teams): extract match teams section'
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/playwright-production.yml')
          s = p.read_text()
          start = s.index('\n  one-shot-teams-refactor:')
          s = s[:start].rstrip() + '\n'
          p.write_text(s)
          PY
          git add .github/workflows/playwright-production.yml
          git commit -m 'chore: remove one-shot teams refactor job'
          git push
