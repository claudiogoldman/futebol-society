name: Society stats service refactor (once)

on:
  push:
    branches: [main]

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, 'refactor: wire Society stats mutations to service layer') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch handlers
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app/society-page.js';
          let s = fs.readFileSync(path, 'utf8');

          const oldImport = "import { addGameParticipant, removeGameParticipant, toggleGameWaitlist, setGameCost, setGameGoalkeeperPays, setGamePixDetails as serviceSetGamePixDetails, setGameOrganizer as serviceSetGameOrganizer, setGameLocation as serviceSetGameLocation, setGameMaxPlayers, setGameTeams } from '../lib/services/society-service';";
          const newImport = "import { addGameParticipant, removeGameParticipant, toggleGameWaitlist, setGameCost, setGameGoalkeeperPays, setGamePixDetails as serviceSetGamePixDetails, setGameOrganizer as serviceSetGameOrganizer, setGameLocation as serviceSetGameLocation, setGameMaxPlayers, setGameTeams, setGamePayment, setPlayerStats, setGameResult, setGameGoals, setGameRatings } from '../lib/services/society-service';";
          if (!s.includes(oldImport)) throw new Error('Expected service import not found');
          s = s.replace(oldImport, newImport);

          const replacements = [
            [
              `  const togglePaid = async (gameId, userId, paid) => {\n    const { error } = await supabase.from('payments').upsert({ game_id: gameId, user_id: userId, paid });\n    if (error) { alert('Não foi possível atualizar o pagamento: ' + error.message); return false; }\n    await loadAll();\n    return true;\n  };`,
              `  const togglePaid = async (gameId, userId, paid) => {\n    const { error } = await setGamePayment(gameId, userId, paid);\n    if (error) { alert('Não foi possível atualizar o pagamento: ' + error.message); return false; }\n    await loadAll();\n    return true;\n  };`
            ],
            [
              `  const savePlayerStats = async (gameId, userId, goals, assists) => {\n    const safeGoals = Math.max(0, parseInt(goals, 10) || 0);\n    const safeAssists = Math.max(0, parseInt(assists, 10) || 0);\n    const { error } = await supabase.from('goals').upsert({\n      game_id: gameId,\n      user_id: userId,\n      goals: safeGoals,\n      assists: safeAssists,\n    });\n    if (error) { alert('Não foi possível salvar seus gols/assistências: ' + error.message); return; }\n    loadAll();\n  };`,
              `  const savePlayerStats = async (gameId, userId, goals, assists) => {\n    const safeGoals = Math.max(0, parseInt(goals, 10) || 0);\n    const safeAssists = Math.max(0, parseInt(assists, 10) || 0);\n    const { error } = await setPlayerStats(gameId, userId, safeGoals, safeAssists);\n    if (error) { alert('Não foi possível salvar seus gols/assistências: ' + error.message); return; }\n    loadAll();\n  };`
            ],
            [
              `  const saveResult = async (gameId, scoreA, scoreB, scorers, assists, playerIds) => {\n    const { error: resultError } = await supabase.from('games').update({ score_a: scoreA, score_b: scoreB }).eq('id', gameId);\n    if (resultError) { alert('Não foi possível salvar o placar: ' + resultError.message); return false; }\n    const rows = playerIds.map((id) => ({ game_id: gameId, user_id: id, goals: scorers[id] || 0, assists: assists[id] || 0 }));\n    if (rows.length) {\n      const { error: goalsError } = await supabase.from('goals').upsert(rows);\n      if (goalsError) { alert('O placar foi salvo, mas os gols/assistências não puderam ser salvos: ' + goalsError.message); await loadAll(); return false; }\n    }\n    await loadAll();\n    return true;\n  };`,
              `  const saveResult = async (gameId, scoreA, scoreB, scorers, assists, playerIds) => {\n    const { error: resultError } = await setGameResult(gameId, scoreA, scoreB);\n    if (resultError) { alert('Não foi possível salvar o placar: ' + resultError.message); return false; }\n    const rows = playerIds.map((id) => ({ game_id: gameId, user_id: id, goals: scorers[id] || 0, assists: assists[id] || 0 }));\n    if (rows.length) {\n      const { error: goalsError } = await setGameGoals(gameId, rows);\n      if (goalsError) { alert('O placar foi salvo, mas os gols/assistências não puderam ser salvos: ' + goalsError.message); await loadAll(); return false; }\n    }\n    await loadAll();\n    return true;\n  };`
            ],
            [
              `  const saveRatings = async (gameId, ratingsMap) => {\n    const rows = Object.entries(ratingsMap)\n      .filter(([, score]) => score > 0)\n      .map(([ratedId, score]) => ({ game_id: gameId, rater_id: myId, rated_id: ratedId, score }));\n    if (rows.length) {\n      const { error } = await supabase.from('ratings').upsert(rows);\n      if (error) { alert('Não foi possível salvar as avaliações: ' + error.message); return false; }\n    }\n    await loadAll();\n    return true;\n  };`,
              `  const saveRatings = async (gameId, ratingsMap) => {\n    const rows = Object.entries(ratingsMap)\n      .filter(([, score]) => score > 0)\n      .map(([ratedId, score]) => ({ game_id: gameId, rater_id: myId, rated_id: ratedId, score }));\n    if (rows.length) {\n      const { error } = await setGameRatings(rows);\n      if (error) { alert('Não foi possível salvar as avaliações: ' + error.message); return false; }\n    }\n    await loadAll();\n    return true;\n  };`
            ]
          ];

          for (const [from, to] of replacements) {
            if (!s.includes(from)) throw new Error('Expected handler block not found');
            s = s.replace(from, to);
          }

          fs.writeFileSync(path, s);
          console.log('Patched payment/stats/result/rating handlers');
          NODE
      - name: Validate diff
        run: git diff --check
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
        run: npm run build
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/society-page.js
          git commit -m 'refactor: wire Society stats mutations to service layer'
          git push
