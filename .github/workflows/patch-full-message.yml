name: Patch full match message

on:
  push:
    paths:
      - .github/full-message.patch

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch match CTA and WhatsApp message
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text()

          start = s.find('        <button className={`sf-btn-primary ${(iAmConfirmed || iAmWaitlisted) ?')
          end = s.find("        <div style={{ display: 'flex', gap: 6, marginTop: 10", start)
          assert start >= 0 and end > start, 'CTA boundaries not found'
          new_cta = """        <button className={`sf-btn-primary ${(iAmConfirmed || iAmWaitlisted) ? 'sf-btn-toggle-on' : ''}`} onClick={() => onToggleMyRSVP(game.id)}>\n          {iAmConfirmed\n            ? <><Check size={16} /> Você está inscrito</>\n            : iAmWaitlisted\n              ? <><span aria-hidden=\"true\">⏳</span> Você está na lista de espera (#{myWaitlistPos + 1})</>\n              : maxPlayers && activePlayers.length >= maxPlayers\n                ? <><span aria-hidden=\"true\">⏳</span> Entrar na lista de espera</>\n                : 'Confirmar minha presença'}\n        </button>\n        {!iAmConfirmed && !iAmWaitlisted && maxPlayers && activePlayers.length >= maxPlayers && (\n          <div className=\"sf-muted-sm\" style={{ marginTop: 6 }}>Partida lotada — entre na lista de espera para ocupar uma vaga se alguém desistir.</div>\n        )}\n"""
          s = s[:start] + new_cta + s[end:]

          start = s.find('  const shareWhatsApp = (game, activePlayers, waitlistPlayers, rateio) => {')
          end = s.find('  const shareGroupWhatsApp = (group) => {', start)
          assert start >= 0 and end > start, 'WhatsApp share boundaries not found'
          new_share = r'''  const shareWhatsApp = (game, activePlayers, waitlistPlayers, rateio) => {
    const teamA = Array.isArray(game.teamA) ? game.teamA : [];
    const teamB = Array.isArray(game.teamB) ? game.teamB : [];
    const hasTeams = teamA.length > 0 || teamB.length > 0;
    const teamNames = (team) => team.map((p, i) => `${i + 1}. ${displayName(p)}`).join('\n');
    const pixKey = game.pixKey || '';
    const pixReceiver = game.pixReceiverName || '';
    const pixCity = game.pixCity || '';
    const pixCode = pixKey ? generatePixCode({ key: pixKey, receiverName: pixReceiver || 'Society', city: pixCity || 'BRASIL', amount: Number(rateio || 0), txid: `JOGO${game.id}` }) : null;
    const coleteTeam = game.coleteTeam === 'A' ? 'Time A' : game.coleteTeam === 'B' ? 'Time B' : null;

    let msg = `⚽ *FUTEBOL SOCIETY — JOGATINA*\n\n`;
    msg += `📅 ${formatDatePtBr(game.date)}\n`;
    if (game.local) msg += `📍 ${game.local}\n`;

    if (hasTeams) {
      msg += `\n🔵 *TIME A*\n${teamNames(teamA) || '—'}\n\n`;
      msg += `🟢 *TIME B*\n${teamNames(teamB) || '—'}\n`;
      msg += `\n🦺 *COLETE:* ${coleteTeam || 'A definir'}\n`;
    }

    if (pixKey) {
      msg += `\n💰 *PIX DA PARTIDA*\n`;
      msg += `Valor: *${money(rateio || 0)}*\n`;
      msg += `Chave: ${pixKey}\n`;
      if (pixReceiver) msg += `Recebedor: ${pixReceiver}\n`;
      if (pixCode) msg += `Código copia-e-cola: ${pixCode}\n`;
    }

    msg += `\n🔗 *Ver partida:* ${window.location.origin}/?join=${game.inviteToken}\n`;

    msg += `\n⏳ *SUPLENTES — LISTA DE ESPERA*\n`;
    if (waitlistPlayers.length) {
      waitlistPlayers.forEach((p, index) => { msg += `${index + 1}. ${displayName(p)} — #${index + 1}\n`; });
      msg += `\n📌 A ordem da lista de espera será respeitada caso surja alguma vaga.\n`;
    } else {
      msg += `— Nenhum suplente no momento.\n`;
    }

    window.open(`https://api.whatsapp.com/send/?text=${encodeURIComponent(msg)}`, '_blank');
  };

'''
          s = s[:start] + new_share + s[end:]
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/society-page.js
          git commit -m "feat(partidas): compartilhar times pix e lista de espera" || exit 0
          git push
