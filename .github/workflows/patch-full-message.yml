name: Patch full match message

on:
  push:
    paths:
      - .github/full-message.patch

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch player profile
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/society-page.js')
          s=p.read_text()
          changed=False
          if 'const [preferredFootDraft' not in s:
              anchor="const [ageDraft, setAgeDraft] = useState(me.age || '');"
              i=s.find(anchor)
              if i<0: raise SystemExit('age state not found')
              end=i+len(anchor)
              s=s[:end]+"\n  const [preferredFootDraft, setPreferredFootDraft] = useState(me.preferred_foot || '');"+s[end:]
              changed=True
          if 'value={preferredFootDraft}' not in s:
              start=s.find('function MyProfileCard')
              pos=s.find('WhatsApp', start)
              if start<0 or pos<0: raise SystemExit('MyProfileCard WhatsApp not found')
              line=s.rfind('<div', start, pos)
              if line<0: raise SystemExit('WhatsApp div not found')
              block='''        <div className="sf-muted-sm" style={{ margin: '12px 0 6px' }}>Pé preferencial</div>\n        <select className="sf-input" value={preferredFootDraft} onChange={(e) => setPreferredFootDraft(e.target.value)} onBlur={() => onUpdate({ preferred_foot: preferredFootDraft || null })}>\n          <option value="">Não informado</option>\n          <option value="direito">Direito / Destro</option>\n          <option value="esquerdo">Esquerdo / Canhoto</option>\n          <option value="ambidestro">Ambidestro</option>\n        </select>\n'''
              s=s[:line]+block+s[line:]
              changed=True
          if not changed: raise SystemExit('profile already patched')
          p.write_text(s)
          PY
      - name: Commit profile patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/society-page.js
          git commit -m "feat(profile): add preferred foot to player profile"
          git push
