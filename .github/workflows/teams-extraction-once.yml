name: Teams extraction once

on:
  push:
    branches: [main]

jobs:
  integrate:
    if: ${{ github.event.head_commit.message != 'refactor(teams): integrate GameTeamsSection' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Teams component
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text()
          old_import = "import TacticalPitch from '../components/society/TacticalPitch';\n"
          new_import = "import GameTeamsSection from '../components/society/GameTeamsSection';\n"
          assert s.count(old_import) == 1, 'unexpected TacticalPitch import count'
          assert "import GameTeamsSection from '../components/society/GameTeamsSection';" not in s, 'GameTeamsSection already imported'
          s = s.replace(old_import, new_import, 1)
          pitch_fn = "function PitchView({ teamA, teamB, playersPerTeam, reservesPerTeam }) {\n  return (\n    <TacticalPitch\n      teamA={teamA}\n      teamB={teamB}\n      playersPerTeam={playersPerTeam}\n      reservesPerTeam={reservesPerTeam}\n    />\n  );\n}\n"
          assert s.count(pitch_fn) == 1, 'unexpected PitchView count'
          s = s.replace(pitch_fn, '', 1)
          start = '      <section className="sf-card">\n        <div className="sf-card-title"><Shuffle size={16} /> Times</div>'
          end = '      <section className="sf-card">\n        <div className="sf-card-title"><Wallet size={16} /> Rateio</div>'
          assert s.count(start) == 1, 'unexpected Times section start count'
          assert s.count(end) == 1, 'unexpected Rateio section count'
          i = s.index(start)
          j = s.index(end, i)
          assert j > i, 'invalid section ordering'
          replacement = '''      <GameTeamsSection
        game={game}
        activePlayers={activePlayers}
        canManage={canManage}
        hasTeams={hasTeams}
        playersPerTeam={playersPerTeam}
        reservesPerTeam={reservesPerTeam}
        editingTeams={editingTeams}
        teamDraft={teamDraft}
        setTeamDraft={setTeamDraft}
        setEditingTeams={setEditingTeams}
        onDraw={onDraw}
        onSaveTeams={onSaveTeams}
        isGoalkeeper={isGoleiro}
      />

'''
          s = s[:i] + replacement + s[j:]
          assert s.count('GameTeamsSection') == 2, 'integration count mismatch'
          assert 'function PitchView' not in s, 'PitchView was not removed'
          assert 'TacticalPitch' not in s, 'TacticalPitch should now be owned by GameTeamsSection'
          p.write_text(s)
          PY
          git diff --check
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Commit integration and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/society-page.js
          git commit -m 'refactor(teams): integrate GameTeamsSection'
          git rm .github/workflows/teams-extraction-once.yml
          git commit -m 'chore: remove one-shot Teams workflow'
          git push
