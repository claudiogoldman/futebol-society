name: Fix waitlist active players

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text()
          old = """  // The persistent game_waitlist table is the source of truth for substitutes.\n  const waitlistIds = game.waitlist || [];\n  const waitlistPlayers = waitlistIds.map((id) => roster.find((p) => p.id === id)).filter(Boolean);\n"""
          new = """  // Confirmed participants and the persistent waitlist are separate sources of truth.\n  const confirmedPlayers = game.confirmed.map((id) => roster.find((p) => p.id === id)).filter(Boolean);\n  const maxPlayers = game.maxPlayers || null;\n  const activePlayers = maxPlayers ? confirmedPlayers.slice(0, maxPlayers) : confirmedPlayers;\n  const waitlistIds = game.waitlist || [];\n  const waitlistPlayers = waitlistIds.map((id) => roster.find((p) => p.id === id)).filter(Boolean);\n"""
          if old not in s:
              raise SystemExit('waitlist block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: consistency-refactor-build-key
        run: |
          npm ci
          npm run build
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/society-page.js
          git commit -m "fix: restore active player calculation"
          git rm .github/workflows/fix-waitlist-active-players.yml
          git commit -m "chore: remove one-shot waitlist fix"
          git push origin HEAD:main
