name: Integrate Society helpers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'refactor: integrate Society Pix helpers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Integrate Pix helpers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text(encoding='utf-8')
          formatter_import = "import { formatDatePtBr, WEEKDAY_LABELS, nextDateForWeekday, money, gameLocationQuery, gameMapUrls } from '../lib/ui/society-formatters';"
          pix_import = "import { generatePixCode, pixKeyType, pixKeyWarning } from '../lib/domain/pix';"
          if "from '../lib/domain/pix'" not in s:
              if formatter_import not in s:
                  raise SystemExit('Society formatter import marker not found')
              s = s.replace(formatter_import, formatter_import + "\n" + pix_import, 1)

          start = s.find('// ---------- pix "copia e cola" generator (BR Code / EMV standard, no gateway needed) ----------')
          end = s.find('\n\n\nfunction StarRating', start)
          if start < 0 or end < 0:
              raise SystemExit('Pix helper block boundaries not found')
          s = s[:start] + '// ---------- pix helpers (domain) ----------' + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate refactor
        run: |
          test -f lib/domain/pix.js
          node --check app/society-page.js
          node --check lib/domain/pix.js
          grep -q "from '../lib/domain/pix'" app/society-page.js
          ! grep -q '^function crc16' app/society-page.js
          ! grep -q '^function generatePixCode' app/society-page.js
          ! grep -q '^function pixKeyType' app/society-page.js
          ! grep -q '^function pixKeyWarning' app/society-page.js
          git diff --check

      - name: Commit refactor and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/integrate-game-chat.yml .github/tmp-pix-trigger.txt
          git add app/society-page.js
          git add -u .github/workflows/integrate-game-chat.yml .github/tmp-pix-trigger.txt
          git commit -m "refactor: integrate Society Pix helpers"
          git push origin HEAD:main
