name: fix game detail runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'runtime fix trigger')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text()
          old = 'onSavePlayerStats, onSaveRatings, onDelete, onShare }) {'
          new = 'onSavePlayerStats, onSaveRatings, onGameRefresh, onDelete, onShare }) {'
          assert s.count(old) == 1, f'unexpected signature matches: {s.count(old)}'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          test "$(grep -o 'onGameRefresh' app/society-page.js | wc -l)" -ge 2
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-game-detail-runtime.yml
          git add app/society-page.js .github/workflows/fix-game-detail-runtime.yml
          git commit -m 'fix(game-detail): wire refresh callback into GameDetail'
          git push
