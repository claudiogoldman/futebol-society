name: Repair Game Detail Audit
on:
  push:
    branches: [fix/game-detail-audit]

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair evaluation tab and PIX owner, then validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text(encoding='utf-8')
          old_eval = '''      {game.result && hasTeams && (\n        <EvaluationSection game={game} myId={myId} onSaveRatings={onSaveRatings} />\n      )}'''
          new_eval = '''      {game.result && hasTeams && (\n        <section data-game-section="resultado">\n          <EvaluationSection game={game} myId={myId} onSaveRatings={onSaveRatings} />\n        </section>\n      )}'''
          if old_eval in s:
              s = s.replace(old_eval, new_eval, 1)
          elif new_eval not in s:
              raise SystemExit('EvaluationSection source block not found')
          old_pix = "setPixDraft(game.pixKey || '');\n    setPixReceiverDraft(game.pixReceiverName || organizer?.name || '');"
          new_pix = "setPixDraft(game.pixKey || '');\n    setPixOwnerDraft(game.pixOwnerId || '');\n    setPixReceiverDraft(game.pixReceiverName || organizer?.name || '');"
          if old_pix in s:
              s = s.replace(old_pix, new_pix, 1)
          elif new_pix not in s:
              raise SystemExit('PIX edit initialization block not found')
          p.write_text(s, encoding='utf-8')
          PY
          npm ci --no-audit --no-fund
          NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder npm run build
          git diff --check
      - name: Commit repair and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/society-page.js .github/workflows/repair-game-detail-audit.yml
          git commit -m 'fix(game-detail): encapsulate evaluation and preserve PIX owner'
          git rm .github/workflows/repair-game-detail-audit.yml
          git commit -m 'chore: remove one-shot repair workflow'
          git push
