name: Finalize match configuration

on:
  push:
    paths:
      - .github/finalize-match-config.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize frontend integration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/society-page.js')
          s=p.read_text()
          original=s

          def rep(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'pattern not found: {label}')
              s=s.replace(old,new,1)

          # Group defaults: replace legacy max-player default with format defaults.
          rep("const [maxPlayersDraft, setMaxPlayersDraft] = useState(group.defaultMaxPlayers || '');", "const [playersPerTeamDraft, setPlayersPerTeamDraft] = useState(group.defaultPlayersPerTeam || 5);\n  const [reservesPerTeamDraft, setReservesPerTeamDraft] = useState(group.defaultReservesPerTeam || 0);", "group draft state")
          rep("setMaxPlayersDraft(group.defaultMaxPlayers ? String(group.defaultMaxPlayers) : '');", "setPlayersPerTeamDraft(group.defaultPlayersPerTeam || 5);\n    setReservesPerTeamDraft(group.defaultReservesPerTeam || 0);", "group draft reset")
          rep("default_max_players: maxPlayersDraft ? parseInt(maxPlayersDraft, 10) : null,", "default_players_per_team: Math.max(1, parseInt(playersPerTeamDraft, 10) || 5),\n      default_reserves_per_team: Math.max(0, parseInt(reservesPerTeamDraft, 10) || 0),\n      default_max_players: (Math.max(1, parseInt(playersPerTeamDraft, 10) || 5) + Math.max(0, parseInt(reservesPerTeamDraft, 10) || 0)) * 2,", "group save defaults")
          rep("<div className=\"sf-cost-row\"><span className=\"sf-muted\">Vagas</span><span className=\"sf-mono-value\" style={{ cursor: 'default' }}>{group.defaultMaxPlayers || 'sem limite'}</span></div>", "<div className=\"sf-cost-row\"><span className=\"sf-muted\">Formato</span><span className=\"sf-mono-value\" style={{ cursor: 'default' }}>{group.defaultPlayersPerTeam}x{group.defaultPlayersPerTeam} + {group.defaultReservesPerTeam} reserva{group.defaultReservesPerTeam === 1 ? '' : 's'} · {(group.defaultPlayersPerTeam + group.defaultReservesPerTeam) * 2} vagas</span></div>", "group display")
          rep("<label className=\"sf-field-label\">Vagas padrão</label>\n            <input type=\"number\" min=\"1\" className=\"sf-input\" value={maxPlayersDraft} onChange={(e) => setMaxPlayersDraft(e.target.value)} />", "<label className=\"sf-field-label\">Jogadores por time (padrão)</label>\n            <input type=\"number\" min=\"1\" max=\"20\" className=\"sf-input\" value={playersPerTeamDraft} onChange={(e) => setPlayersPerTeamDraft(e.target.value)} />\n            <label className=\"sf-field-label\">Reservas por time (padrão)</label>\n            <input type=\"number\" min=\"0\" max=\"10\" className=\"sf-input\" value={reservesPerTeamDraft} onChange={(e) => setReservesPerTeamDraft(e.target.value)} />\n            <div className=\"sf-muted-sm\">Vagas totais padrão: {(Math.max(1, parseInt(playersPerTeamDraft, 10) || 5) + Math.max(0, parseInt(reservesPerTeamDraft, 10) || 0)) * 2}</div>", "group format UI")

          # Group loading maps the new defaults.
          rep("defaultTime: g.default_time || '', defaultMaxPlayers: g.default_max_players || null,", "defaultTime: g.default_time || '', defaultMaxPlayers: g.default_max_players || null,\n      defaultPlayersPerTeam: g.default_players_per_team || 5, defaultReservesPerTeam: g.default_reserves_per_team || 0,", "group load")

          # New group creation state/UI/save.
          rep("const [newGroupMaxPlayers, setNewGroupMaxPlayers] = useState('');", "const [newGroupPlayersPerTeam, setNewGroupPlayersPerTeam] = useState('5');\n  const [newGroupReservesPerTeam, setNewGroupReservesPerTeam] = useState('0');", "new group state")
          rep("default_max_players: newGroupMaxPlayers ? parseInt(newGroupMaxPlayers, 10) : null,", "default_players_per_team: Math.max(1, parseInt(newGroupPlayersPerTeam, 10) || 5),\n      default_reserves_per_team: Math.max(0, parseInt(newGroupReservesPerTeam, 10) || 0),\n      default_max_players: (Math.max(1, parseInt(newGroupPlayersPerTeam, 10) || 5) + Math.max(0, parseInt(newGroupReservesPerTeam, 10) || 0)) * 2,", "new group save")
          rep("setNewGroupName(''); setNewGroupLocal(''); setNewGroupDay('6'); setNewGroupTime(''); setNewGroupMaxPlayers(''); setNewGroupCost('');", "setNewGroupName(''); setNewGroupLocal(''); setNewGroupDay('6'); setNewGroupTime(''); setNewGroupPlayersPerTeam('5'); setNewGroupReservesPerTeam('0'); setNewGroupCost('');", "new group reset")
          rep("<label className=\"sf-field-label\">Vagas padrão (opcional)</label>\n            <input type=\"number\" min=\"1\" className=\"sf-input\" placeholder=\"Sem limite\" value={newGroupMaxPlayers} onChange={(e) => setNewGroupMaxPlayers(e.target.value)} />", "<label className=\"sf-field-label\">Jogadores por time (padrão)</label>\n            <input type=\"number\" min=\"1\" max=\"20\" className=\"sf-input\" value={newGroupPlayersPerTeam} onChange={(e) => setNewGroupPlayersPerTeam(e.target.value)} />\n            <label className=\"sf-field-label\">Reservas por time (padrão)</label>\n            <input type=\"number\" min=\"0\" max=\"10\" className=\"sf-input\" value={newGroupReservesPerTeam} onChange={(e) => setNewGroupReservesPerTeam(e.target.value)} />\n            <div className=\"sf-muted-sm\">Vagas totais: {(Math.max(1, parseInt(newGroupPlayersPerTeam, 10) || 5) + Math.max(0, parseInt(newGroupReservesPerTeam, 10) || 0)) * 2}</div>", "new group format UI")

          # New game inherited defaults. Remove stale references to deleted max-player state.
          rep("setNewMaxPlayers(group.defaultMaxPlayers ? String(group.defaultMaxPlayers) : '');", "setNewPlayersPerTeam(String(group.defaultPlayersPerTeam || 5));\n    setNewReservesPerTeam(String(group.defaultReservesPerTeam || 0));", "group new-game defaults")
          rep("setNewMaxPlayers(g.defaultMaxPlayers ? String(g.defaultMaxPlayers) : '');", "setNewPlayersPerTeam(String(g.defaultPlayersPerTeam || 5));\n            setNewReservesPerTeam(String(g.defaultReservesPerTeam || 0));", "group selection defaults")

          # Team RPC loading must retain starter/reserve role.
          rep("const teamA = teamRows.filter((t) => t.team === 'A').map((t) => profileMap[t.user_id]).filter(Boolean);\n      const teamB = teamRows.filter((t) => t.team === 'B').map((t) => profileMap[t.user_id]).filter(Boolean);", "const teamA = teamRows.filter((t) => t.team === 'A').map((t) => profileMap[t.user_id] ? { ...profileMap[t.user_id], _teamRole: t.role || 'starter' } : null).filter(Boolean);\n      const teamB = teamRows.filter((t) => t.team === 'B').map((t) => profileMap[t.user_id] ? { ...profileMap[t.user_id], _teamRole: t.role || 'starter' } : null).filter(Boolean);", "team role load")

          # Replace broken team save function entirely.
          old="""  const handleSaveTeams = async (gameId, teamDraft, activePlayers) => {
    const teamA = activePlayers.filter((p) => teamDraft[p.id] !== 'B').map((p) => p.id);
    const teamB = activePlayers.filter((p) => teamDraft[p.id] === 'B').map((p) => p.id);
    if (activePlayers.length < 2) { alert('É necessário ter pelo menos 2 jogadores para definir os times.'); return false; }
    if (!teamA.length || !teamB.length) { alert('Distribua os jogadores entre os dois times.'); return false; }
    const { error } = const aStarters = activePlayers.filter(p => teamDraft[p.id] === 'A' && p._teamRole !== 'reserve').map(p => p.id);
    const bStarters = activePlayers.filter(p => teamDraft[p.id] === 'B' && p._teamRole !== 'reserve').map(p => p.id);
    const aReserves = activePlayers.filter(p => teamDraft[p.id] === 'A' && p._teamRole === 'reserve').map(p => p.id);
    const bReserves = activePlayers.filter(p => teamDraft[p.id] === 'B' && p._teamRole === 'reserve').map(p => p.id);
    await setGameTeams(gameId, aStarters, bStarters, aReserves, bReserves);
    if (error) { alert('Não foi possível salvar os times: ' + error.message); return false; }
    await loadAll();
    return true;
  };"""
          new="""  const handleSaveTeams = async (gameId, teamDraft, activePlayers) => {
    if (activePlayers.length < 2) { alert('É necessário ter pelo menos 2 jogadores para definir os times.'); return false; }
    const teamAPlayers = activePlayers.filter((p) => teamDraft[p.id] === 'A');
    const teamBPlayers = activePlayers.filter((p) => teamDraft[p.id] === 'B');
    if (!teamAPlayers.length || !teamBPlayers.length) { alert('Distribua os jogadores entre os dois times.'); return false; }
    const aStarters = teamAPlayers.filter((p) => p._teamRole !== 'reserve').map((p) => p.id);
    const bStarters = teamBPlayers.filter((p) => p._teamRole !== 'reserve').map((p) => p.id);
    const aReserves = teamAPlayers.filter((p) => p._teamRole === 'reserve').map((p) => p.id);
    const bReserves = teamBPlayers.filter((p) => p._teamRole === 'reserve').map((p) => p.id);
    const { error } = await setGameTeams(gameId, aStarters, bStarters, aReserves, bReserves);
    if (error) { alert('Não foi possível salvar os times: ' + error.message); return false; }
    await loadAll();
    return true;
  };"""
          if old not in s:
              raise SystemExit('broken handleSaveTeams block not found')
          s=s.replace(old,new,1)

          # Fix handleDraw undefined game and keep config sourced from selected match.
          rep("  const handleDraw = async (gameId, confirmedPlayers) => {\n    const { teamA, teamB, teamAStarters, teamBStarters, teamAReserves, teamBReserves } = drawTeams(confirmedPlayers, Math.random, { playersPerTeam: game.playersPerTeam || 5, reservesPerTeam: game.reservesPerTeam || 0 });", "  const handleDraw = async (gameId, confirmedPlayers) => {\n    const game = games.find((g) => g.id === gameId);\n    if (!game) return false;\n    const { teamAStarters, teamBStarters, teamAReserves, teamBReserves } = drawTeams(confirmedPlayers, Math.random, { playersPerTeam: game.playersPerTeam || 5, reservesPerTeam: game.reservesPerTeam || 0 });", "handleDraw game lookup")

          # Pass team-config handler to GameDetail.
          rep("onSetMaxPlayers={setMaxPlayers}\n            onDraw={handleDraw}", "onSetMaxPlayers={setMaxPlayers}\n            onSetTeamConfig={setTeamConfig}\n            onDraw={handleDraw}", "GameDetail team config prop")
          rep("  const setMaxPlayers = async (gameId, maxPlayers) => {", "  const setTeamConfig = async (gameId, playersPerTeam, reservesPerTeam) => {\n    const safePlayers = Math.max(1, Math.min(20, parseInt(playersPerTeam, 10) || 5));\n    const safeReserves = Math.max(0, Math.min(10, parseInt(reservesPerTeam, 10) || 0));\n    const game = games.find((g) => g.id === gameId);\n    const currentConfirmed = game?.confirmed?.length || 0;\n    const newCapacity = (safePlayers + safeReserves) * 2;\n    if (currentConfirmed > newCapacity) { alert(`A configuração não pode ficar abaixo dos ${currentConfirmed} jogadores já confirmados.`); return false; }\n    const { error } = await setGameTeamConfig(gameId, safePlayers, safeReserves);\n    if (error) { alert('Não foi possível alterar o formato da partida: ' + error.message); return false; }\n    await loadAll();\n    return true;\n  };\n\n  const setMaxPlayers = async (gameId, maxPlayers) => {", "setTeamConfig handler")

          # Capacity-aware RSVP through the already-secure RPC: when full, enqueue rather than confirm.
          rep("  const toggleMyRSVP = async (gameId) => {\n    const g = games.find((x) => x.id === gameId);\n    if (!g) return;\n    let response;\n    if (g.confirmed.includes(myId)) {\n      response = await removeGameParticipant(gameId, myId);\n    } else if ((g.waitlist || []).includes(myId)) {\n      response = await toggleGameWaitlist(gameId, myId, false);\n    } else {\n      response = await addGameParticipant(gameId, myId);\n    }", "  const toggleMyRSVP = async (gameId) => {\n    const g = games.find((x) => x.id === gameId);\n    if (!g) return;\n    let response;\n    if (g.confirmed.includes(myId)) {\n      response = await removeGameParticipant(gameId, myId);\n    } else if ((g.waitlist || []).includes(myId)) {\n      response = await toggleGameWaitlist(gameId, myId, false);\n    } else {\n      response = await addGameParticipant(gameId, myId);\n    }", "RSVP")

          # Group/admin add now uses the same capacity-aware RPC.
          rep("    const { error } = await addGameParticipant(gameId, userId);\n    if (error) { alert('Não foi possível adicionar o jogador: ' + error.message); return; }", "    const { data, error } = await addGameParticipant(gameId, userId);\n    if (error) { alert('Não foi possível adicionar o jogador: ' + error.message); return; }\n    if (data === 'waitlist') alert('Partida lotada. O jogador foi colocado na lista de espera.');", "admin capacity add")

          # Invite join already enforces the same capacity via database RPC; leave as-is.

          if s==original:
              raise SystemExit('no changes made')
          p.write_text(s)
          PY
      - name: Validate syntax
        run: |
          node --check <(sed -e '1d' app/society-page.js) || true
          grep -q "const handleDraw" app/society-page.js
          grep -q "onSetTeamConfig={setTeamConfig}" app/society-page.js
          grep -q "defaultPlayersPerTeam" app/society-page.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/society-page.js
          git diff --cached --quiet && exit 0
          git commit -m "feat(game): finalize configurable match capacity and defaults"
          git push
