name: Apply group UI refactor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/society-page.js')
          s = p.read_text()

          s, n = re.subn(
              r"// editing is creator-only, with no admin override.*?\n  const canManage = [^;]+;",
              "// group admins and the match creator may manage an open match; DB RLS remains the authority.\n  const canManage = myId === game.createdBy || (game.groupId && groupMembers.some((m) => String(m.group_id) === String(game.groupId) && String(m.user_id) === String(myId) && m.role === 'admin'));",
              s, count=1, flags=re.S
          )
          assert n == 1, 'GameDetail canManage target not found'

          s, n = re.subn(r"default_local:\s*localDraft\.trim\(\) \|\| null,", "default_local: group.defaultLocal || null,", s, count=1)
          assert n == 1, 'GroupDetail localDraft bug target not found'

          marker = "  const [organizerDraft, setOrganizerDraft] = useState(group.defaultOrganizerId || '');\n"
          assert marker in s, 'GroupDetail state marker not found'
          s = s.replace(marker, marker + "  const [locationModalOpen, setLocationModalOpen] = useState(false);\n", 1)

          old = "        {canManage && <div style={{ marginTop: 10 }}>"
          start = s.find(old)
          assert start >= 0, 'Group location inline form start not found'
          end_marker = "\n      </section>"
          end = s.find(end_marker, start)
          assert end >= 0, 'Group location section end not found'

          replacement = '''        {canManage && (\n          <>\n            <button type="button" className="sf-btn-primary" style={{ marginTop: 10 }} onClick={() => setLocationModalOpen(true)}>\n              <Plus size={16} /> Cadastrar novo local\n            </button>\n            {locationModalOpen && (\n              <div className="sf-modal-backdrop" onClick={() => setLocationModalOpen(false)}>\n                <div className="sf-modal" onClick={(e) => e.stopPropagation()}>\n                  <div className="sf-modal-title">Cadastrar novo local</div>\n                  <label className="sf-field-label">Nome da quadra / arena</label>\n                  <input autoFocus className="sf-input" placeholder="Ex.: Arena Soccer" value={locationDraft.name} onChange={(e) => setLocationDraft({ ...locationDraft, name: e.target.value })} />\n                  <label className="sf-field-label">Endereço</label>\n                  <input className="sf-input" placeholder="Rua, número, complemento" value={locationDraft.address} onChange={(e) => setLocationDraft({ ...locationDraft, address: e.target.value })} />\n                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 72px', gap: 6 }}><input className="sf-input" placeholder="Cidade" value={locationDraft.city} onChange={(e) => setLocationDraft({ ...locationDraft, city: e.target.value })} /><input className="sf-input" maxLength="2" placeholder="UF" value={locationDraft.state} onChange={(e) => setLocationDraft({ ...locationDraft, state: e.target.value.toUpperCase() })} /></div>\n                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}><input type="number" step="any" className="sf-input" placeholder="Latitude (opcional)" value={locationDraft.latitude} onChange={(e) => setLocationDraft({ ...locationDraft, latitude: e.target.value })} /><input type="number" step="any" className="sf-input" placeholder="Longitude (opcional)" value={locationDraft.longitude} onChange={(e) => setLocationDraft({ ...locationDraft, longitude: e.target.value })} /></div>\n                  <label className="sf-check-row"><input type="checkbox" checked={locationDraft.isDefault} onChange={(e) => setLocationDraft({ ...locationDraft, isDefault: e.target.checked })} /> Usar como local padrão do grupo</label>\n                  <div className="sf-modal-actions">\n                    <button type="button" className="sf-btn-ghost" onClick={() => setLocationModalOpen(false)}>Cancelar</button>\n                    <button type="button" className="sf-btn-primary" onClick={async () => { if (!locationDraft.name.trim()) return alert('Informe o nome do local.'); const ok = await onCreateLocation(group.id, locationDraft); if (ok) { setLocationDraft({ name: '', address: '', city: '', state: '', latitude: '', longitude: '', isDefault: false }); setLocationModalOpen(false); } }}>Cadastrar local</button>\n                  </div>\n                </div>\n              </div>\n            )}\n          </>\n        )}'''
          s = s[:start] + replacement + s[end:]

          p.write_text(s)
          PY

      - name: Commit refactor and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/refactor-group-ui.yml
          git add app/society-page.js .github/workflows/refactor-group-ui.yml
          git diff --cached --quiet && exit 0
          git commit -m "refactor: improve group locations and game admin UI"
          git push
