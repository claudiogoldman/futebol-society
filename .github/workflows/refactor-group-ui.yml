name: Apply group UI refactor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect targets
        run: |
          echo '--- canManage ---'
          grep -n "canManage" app/society-page.js | head -20 || true
          echo '--- localDraft/default_local ---'
          grep -nE "localDraft|default_local" app/society-page.js | head -20 || true
          echo '--- location form ---'
          grep -n "Cadastrar novo local" app/society-page.js | head -20 || true
      - name: Stop
        run: exit 1
