name: Apply Style Hydration Fix

on:
  push:
    branches: [fix/style-hydration]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/style-hydration
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace escaped CSS render pattern
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/page.js')
          source = path.read_text()
          old = '<style>{CSS}</style>'
          new = '<style dangerouslySetInnerHTML={{ __html: CSS }} />'
          count = source.count(old)
          if count == 0:
              raise SystemExit('No style render pattern found')
          path.write_text(source.replace(old, new))
          print(f'Replaced {count} style render occurrence(s)')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.js
          if git diff --cached --quiet; then
            echo 'No page change to commit'
            exit 0
          fi
          git commit -m 'fix: render inline CSS without hydration escaping'
          git push origin HEAD:fix/style-hydration
