name: Apply Society audit changes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'feat: improve guests, locations and sharing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply source changes
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/page.js')
          s = p.read_text()
          def r(a,b,label):
              n=s.count(a)
              if n != 1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              nonlocal_s[0]=nonlocal_s[0].replace(a,b)
          nonlocal_s=[s]
          def R(a,b,label):
              n=nonlocal_s[0].count(a)
              if n != 1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              nonlocal_s[0]=nonlocal_s[0].replace(a,b)

          R("function GameDetail({ game, roster, groupMembers, groupMemberIds, myId, isAdmin, onBack, onToggleMyRSVP, onAddParticipant, onRemoveParticipant, onSetCost, onSetGkPays, onSetMaxPlayers, onSetGamePixDetails, onSetGameOrganizer, onSetGameLocation, onDraw, onTogglePaid, onSaveResult, onSavePlayerStats, onSaveRatings, onDelete, onShare }) {",
             "function GameDetail({ game, roster, groupMembers, groupMemberIds, myId, isAdmin, onBack, onToggleMyRSVP, onAddParticipant, onAddGuest, onRemoveParticipant, onSetCost, onSetGkPays, onSetMaxPlayers, onSetGamePixDetails, onSetGameOrganizer, onSetGameLocation, onDraw, onTogglePaid, onSaveResult, onSavePlayerStats, onSaveRatings, onDelete, onShare }) {", 'props')
          R("  const [participantDraft, setParticipantDraft] = useState('');",
             "  const [participantDraft, setParticipantDraft] = useState('');\n  const [guestNameDraft, setGuestNameDraft] = useState('');\n  const [guestPositionDraft, setGuestPositionDraft] = useState('');", 'guest state')
          R("        {canManage && game.groupId && (\n          <div style={{ display: 'grid', gridTemplateColumns: '1fr auto', gap: 8, marginTop: 10 }}>",
             "        {canManage && game.groupId && (\n          <>\n          <div style={{ display: 'grid', gridTemplateColumns: '1fr auto', gap: 8, marginTop: 10 }}>", 'guest wrapper')
          R("            <button className=\"sf-btn-ghost\" disabled={!participantDraft} onClick={async () => { await onAddParticipant(game.id, participantDraft); setParticipantDraft(''); }}>Adicionar</button>\n          </div>\n        )}\n      </section>",
             "            <button className=\"sf-btn-ghost\" disabled={!participantDraft} onClick={async () => { await onAddParticipant(game.id, participantDraft); setParticipantDraft(''); }}>Adicionar</button>\n          </div>\n          <div style={{ marginTop: 10, paddingTop: 10, borderTop: '1px solid var(--sf-border)' }}>\n            <div className=\"sf-muted-sm\" style={{ marginBottom: 6 }}>Convidado avulso (não cadastrado)</div>\n            <div style={{ display: 'grid', gridTemplateColumns: '1fr 150px auto', gap: 8 }}>\n              <input className=\"sf-input\" placeholder=\"Nome do convidado\" value={guestNameDraft} onChange={(e) => setGuestNameDraft(e.target.value)} />\n              <select className=\"sf-input\" value={guestPositionDraft} onChange={(e) => setGuestPositionDraft(e.target.value)}>\n                <option value=\"\">Posição</option>\n                {POSITION_ORDER.map((pos) => <option key={pos} value={pos}>{POSITION_LABELS[pos]}</option>)}\n              </select>\n              <button className=\"sf-btn-ghost\" disabled={!guestNameDraft.trim()} onClick={async () => { const ok = await onAddGuest(game.id, guestNameDraft, guestPositionDraft); if (ok) { setGuestNameDraft(''); setGuestPositionDraft(''); } }}>Adicionar</button>\n            </div>\n            <div className=\"sf-muted-sm\" style={{ marginTop: 5 }}>A posição será usada no sorteio e no desenho dos times.</div>\n          </div>\n          </>\n        )}\n      </section>", 'guest ui')
          R("            <select className=\"sf-input-inline\" value={game.organizerId || ''} onChange={(e) => onSetGameOrganizer(game.id, e.target.value || null)}>",
             "            <select className=\"sf-input-inline\" style={{ width: 180, minWidth: 160, flex: '0 1 180px' }} value={game.organizerId || ''} onChange={(e) => onSetGameOrganizer(game.id, e.target.value || null)}>", 'organizer width')
          R("            {canManage && (\n              <button className=\"sf-btn-primary\" onClick={() => onDraw(game.id, activePlayers)}>\n                <Shuffle size={16} /> {hasTeams ? 'Sortear novamente' : 'Sortear times'}\n              </button>\n            )}",
             "            {canManage && (\n              <button className=\"sf-btn-primary\" onClick={() => onDraw(game.id, activePlayers)}>\n                <Shuffle size={16} /> {hasTeams ? 'Sortear novamente' : 'Sortear times'}\n              </button>\n            )}\n            {hasTeams && (\n              <button className=\"sf-btn-whatsapp\" style={{ marginTop: 8 }} onClick={() => onShare(game, activePlayers, waitlistPlayers, rateio)}>\n                <Share2 size={16} /> Compartilhar times e rateio no WhatsApp\n              </button>\n            )}", 'team share')
          R("  const addParticipant = async (gameId, userId) => {",
             "  const addGuest = async (gameId, name, position) => {\n    const cleanName = name.trim();\n    if (!cleanName) { alert('Informe o nome do convidado.'); return false; }\n    const positions = position ? [position] : [];\n    const { data, error } = await supabase.rpc('add_game_guest', { p_game_id: gameId, p_name: cleanName, p_email: null, p_nationality_code: 'BR', p_positions: positions });\n    if (error) { alert('Não foi possível adicionar o convidado: ' + error.message); return false; }\n    await loadAll();\n    return !!data;\n  };\n\n  const addParticipant = async (gameId, userId) => {", 'guest handler')
          R("            onAddParticipant={addParticipant}\n            onRemoveParticipant={removeParticipant}",
             "            onAddParticipant={addParticipant}\n            onAddGuest={addGuest}\n            onRemoveParticipant={removeParticipant}", 'guest prop')
          R("  const shareGroupWhatsApp = (group) => {",
             "  const shareRankingWhatsApp = () => {\n    const group = groups.find((g) => String(g.id) === String(rankingGroupFilter));\n    if (!group || ranking.length === 0) return;\n    let msg = `🏆 *Ranking — ${group.name}*\\n\\n`;\n    msg += ranking.map((r, i) => `${i + 1}. ${r.name} — ${r.pontos} pts | ${r.jogos}J ${r.vit}V | ${r.gols}G/${r.assistencias}A | Nota ${r.nota != null ? r.nota.toFixed(1) : '—'}`).join('\\n');\n    msg += `\\n\\n📊 Pontuação: vitória 3 · empate 1 · derrota 0`;\n    window.open(`https://api.whatsapp.com/send/?text=${encodeURIComponent(msg)}`, '_blank');\n  };\n\n  const shareGroupWhatsApp = (group) => {", 'ranking share')
          R("              </div>\n              </>\n            )}\n          </div>",
             "              </div>\n              {ranking.length > 0 && (\n                <button className=\"sf-btn-whatsapp\" style={{ marginTop: 10 }} onClick={shareRankingWhatsApp}>\n                  <Share2 size={16} /> Compartilhar ranking no WhatsApp\n                </button>\n              )}\n              </>\n            )}\n          </div>", 'ranking button')
          R("    setNewGamePixReceiverName(defaultOrganizer?.pix_key ? (defaultOrganizer.name || '') : (group.defaultPixReceiverName || ''));\n    setNewGamePixReceiverName(group.defaultPixReceiverName || '');",
             "    setNewGamePixReceiverName(defaultOrganizer?.pix_key ? (defaultOrganizer.name || '') : (group.defaultPixReceiverName || ''));", 'duplicate pix assignment')
          R("      default_local: newGroupLocal.trim() || null,\n", '', 'legacy default local')
          R("  const [locationDraft, setLocationDraft] = useState({ name: '', address: '', city: '', state: '', latitude: '', longitude: '', isDefault: false });",
             "  const [locationDraft, setLocationDraft] = useState({ name: '', address: '', city: '', state: '', latitude: '', longitude: '', cost: '', isDefault: false });", 'location state')
          R("latitude: draft.latitude === '' ? null : Number(draft.latitude), longitude: draft.longitude === '' ? null : Number(draft.longitude), is_default: !!draft.isDefault,",
             "latitude: draft.latitude === '' ? null : Number(draft.latitude), longitude: draft.longitude === '' ? null : Number(draft.longitude), cost: draft.cost === '' ? null : Number(draft.cost), is_default: !!draft.isDefault,", 'location insert')
          R("<div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6, marginTop: 6 }}><input type=\"number\" step=\"any\" className=\"sf-input\" placeholder=\"Latitude\" value={locationDraft.latitude} onChange={(e) => setLocationDraft({ ...locationDraft, latitude: e.target.value })} /><input type=\"number\" step=\"any\" className=\"sf-input\" placeholder=\"Longitude\" value={locationDraft.longitude} onChange={(e) => setLocationDraft({ ...locationDraft, longitude: e.target.value })} /></div>",
             "<div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6, marginTop: 6 }}><input type=\"number\" step=\"any\" className=\"sf-input\" placeholder=\"Latitude\" value={locationDraft.latitude} onChange={(e) => setLocationDraft({ ...locationDraft, latitude: e.target.value })} /><input type=\"number\" step=\"any\" className=\"sf-input\" placeholder=\"Longitude\" value={locationDraft.longitude} onChange={(e) => setLocationDraft({ ...locationDraft, longitude: e.target.value })} /></div>\n          <label className=\"sf-field-label\" style={{ marginTop: 6 }}>Custo da quadra neste local</label><input type=\"number\" min=\"0\" step=\"0.01\" className=\"sf-input\" placeholder=\"Usar custo padrão do grupo\" value={locationDraft.cost} onChange={(e) => setLocationDraft({ ...locationDraft, cost: e.target.value })} />", 'location cost ui')
          R("{[loc.address, loc.city && loc.state ? loc.city + '/' + loc.state : (loc.city || loc.state)].filter(Boolean).join(' · ') || 'Endereço não informado'}</div>",
             "{[loc.address, loc.city && loc.state ? loc.city + '/' + loc.state : (loc.city || loc.state)].filter(Boolean).join(' · ') || 'Endereço não informado'}</div>\n            {loc.cost != null && <div className=\"sf-muted-sm\" style={{ marginTop: 3 }}>Quadra: {money(Number(loc.cost))}</div>}", 'location cost display')
          R("  const [inlineLocationDraft, setInlineLocationDraft] = useState({ name: '', address: '', city: '', state: '', latitude: '', longitude: '', isDefault: false });",
             "  const [inlineLocationDraft, setInlineLocationDraft] = useState({ name: '', address: '', city: '', state: '', latitude: '', longitude: '', cost: '', isDefault: false });", 'inline location state')
          R("latitude: inlineLocationDraft.latitude === '' ? null : Number(inlineLocationDraft.latitude), longitude: inlineLocationDraft.longitude === '' ? null : Number(inlineLocationDraft.longitude), is_default: !!inlineLocationDraft.isDefault,",
             "latitude: inlineLocationDraft.latitude === '' ? null : Number(inlineLocationDraft.latitude), longitude: inlineLocationDraft.longitude === '' ? null : Number(inlineLocationDraft.longitude), cost: inlineLocationDraft.cost === '' ? null : Number(inlineLocationDraft.cost), is_default: !!inlineLocationDraft.isDefault,", 'inline location insert')
          R("<label className=\"sf-field-label\">Longitude (opcional)</label><input type=\"number\" step=\"any\" className=\"sf-input\" value={inlineLocationDraft.longitude} onChange={(e) => setInlineLocationDraft({ ...inlineLocationDraft, longitude: e.target.value })} />",
             "<label className=\"sf-field-label\">Longitude (opcional)</label><input type=\"number\" step=\"any\" className=\"sf-input\" value={inlineLocationDraft.longitude} onChange={(e) => setInlineLocationDraft({ ...inlineLocationDraft, longitude: e.target.value })} />\n              <label className=\"sf-field-label\">Custo da quadra neste local</label><input type=\"number\" min=\"0\" step=\"0.01\" className=\"sf-input\" placeholder=\"Usar custo do grupo\" value={inlineLocationDraft.cost} onChange={(e) => setInlineLocationDraft({ ...inlineLocationDraft, cost: e.target.value })} />", 'inline cost ui')
          R("setNewGameLocationId(data.id);\n    setNewLocal(data.name || '');",
             "setNewGameLocationId(data.id);\n    if (data.cost != null) setNewGameCost(String(data.cost));\n    setNewLocal(data.name || '');", 'inline selected cost')
          R("setNewGameLocationId(defaultLocation?.id || '');\n            if (defaultLocation) {",
             "setNewGameLocationId(defaultLocation?.id || '');\n            if (defaultLocation?.cost != null) setNewGameCost(String(defaultLocation.cost));\n            if (defaultLocation) {", 'default location cost')
          R("setNewLocationLongitude(location.longitude != null ? String(location.longitude) : '');\n                  }",
             "setNewLocationLongitude(location.longitude != null ? String(location.longitude) : '');\n                    if (location.cost != null) setNewGameCost(String(location.cost));\n                    else { const selectedGroup = groups.find((gr) => String(gr.id) === String(newGameGroupId)); setNewGameCost(selectedGroup?.defaultCost != null ? String(selectedGroup.defaultCost) : ''); }\n                  }", 'selected location cost')
          R("    setNewGamePixCity(group.defaultPixCity || '');\n    setShowNewGame(true);",
             "    setNewGamePixCity(group.defaultPixCity || '');\n    const defaultLocation = groupLocations.find((l) => String(l.group_id) === String(group.id) && l.is_default) || groupLocations.find((l) => String(l.group_id) === String(group.id));\n    setNewGameLocationId(defaultLocation?.id || '');\n    if (defaultLocation) {\n      setNewLocal(defaultLocation.name || '');\n      setNewLocationAddress(defaultLocation.address || '');\n      setNewLocationCity(defaultLocation.city || '');\n      setNewLocationState(defaultLocation.state || '');\n      setNewLocationLatitude(defaultLocation.latitude != null ? String(defaultLocation.latitude) : '');\n      setNewLocationLongitude(defaultLocation.longitude != null ? String(defaultLocation.longitude) : '');\n      if (defaultLocation.cost != null) setNewGameCost(String(defaultLocation.cost));\n    }\n    setShowNewGame(true);", 'group shortcut location')
          R("supabase.from('group_locations').insert({ group_id: data.id, name: newGroupLocal.trim(), is_default: true, created_by: myId })",
             "supabase.from('group_locations').insert({ group_id: data.id, name: newGroupLocal.trim(), cost: newGroupCost ? parseFloat(newGroupCost) : null, is_default: true, created_by: myId })", 'initial location cost')
          p.write_text(nonlocal_s[0])
      - name: Validate and build
        run: |
          node --check app/page.js
          npm install
          npm run build
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: improve guests, locations and sharing"
          git push
