name: Fix chat mentions

on:
  push:
    paths:
      - .github/chat-mentions.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir sugestões de menção
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/chat/GameChat.js')
          s=p.read_text()
          old="""    const options = Object.entries(names)
      .filter(([id, name]) => id !== userId && normalize(name).startsWith(partial))
      .slice(0, 6)
      .map(([id, name]) => ({ id, name }));"""
          new="""    const options = Object.entries(names)
      .filter(([id, name]) => id !== userId && normalize(name).startsWith(partial))
      .sort(([, a], [, b]) => normalize(a).localeCompare(normalize(b), 'pt-BR'))
      .map(([id, name]) => ({ id, name }));"""
          if old not in s: raise SystemExit('mention options block not found')
          p.write_text(s.replace(old,new,1))

          p=Path('app/society-page.js')
          s=p.read_text()
          old="const playerNames = useMemo(() => Object.fromEntries(roster.map((p) => [p.id, p.name])), [roster]);"
          new="const playerNames = useMemo(() => Object.fromEntries(roster.map((p) => [p.id, displayName(p)])), [roster]);"
          if old not in s: raise SystemExit('playerNames block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/chat/GameChat.js app/society-page.js
          git commit -m "fix(chat): show all players and use nicknames in mentions"
          git push
