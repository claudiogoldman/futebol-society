name: Refactor Society Pix helpers

on:
  push:
    paths:
      - '.github/workflows/refactor-society-pix-helpers.yml'
      - 'app/society-page.js'
      - 'lib/domain/pix.js'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and integrate Society helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/society-page.js')
          s = path.read_text(encoding='utf-8')

          formatter_import = "import { formatDatePtBr, WEEKDAY_LABELS, nextDateForWeekday, money, gameLocationQuery, gameMapUrls } from '../lib/ui/society-formatters';"
          pix_import = "import { generatePixCode, pixKeyType, pixKeyWarning } from '../lib/domain/pix';"
          if "from '../lib/domain/pix'" not in s:
              if formatter_import not in s:
                  raise SystemExit('Society formatter import not found')
              s = s.replace(formatter_import, formatter_import + "\n" + pix_import, 1)

          if "from '../components/chat/GameChat'" not in s:
              position_import = "import PositionTags from '../components/players/PositionTags';"
              if position_import not in s:
                  raise SystemExit('PositionTags import not found')
              s = s.replace(position_import, position_import + "\nimport GameChat from '../components/chat/GameChat';", 1)

          start = s.find('// ---------- pix "copia e cola" generator (BR Code / EMV standard, no gateway needed) ----------')
          end = s.find('\n\n\nfunction StarRating', start)
          if start < 0 or end < 0:
              raise SystemExit('Pix helper block boundaries not found')

          s = s[:start] + '// ---------- pix helpers (domain) ----------' + s[end:]
          path.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check app/society-page.js
          node --check lib/domain/pix.js
          grep -q "from '../lib/domain/pix'" app/society-page.js
          grep -q "from '../components/chat/GameChat'" app/society-page.js
          ! grep -q '^function crc16' app/society-page.js
          ! grep -q '^function generatePixCode' app/society-page.js
          ! grep -q '^function pixKeyType' app/society-page.js
          ! grep -q '^function pixKeyWarning' app/society-page.js
          git diff --check

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/refactor-society-pix-helpers.yml
          git add app/society-page.js
          git add -u .github/workflows/refactor-society-pix-helpers.yml
          git diff --cached --quiet && exit 0
          git commit -m "refactor: integrate Society Pix helpers"
          git push
