name: Game Domain Tests
on:
  push:
    branches: [main]
    paths:
      - 'lib/domain/**'
      - 'tests/game-domain.test.mjs'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'lib/domain/**'
      - 'tests/game-domain.test.mjs'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
