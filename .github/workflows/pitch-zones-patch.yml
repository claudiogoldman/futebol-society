name: Patch pitch zones

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar perfil do jogador e mencoes da partida
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/society-page.js')
          s=p.read_text()
          original=s
          if 'const [preferredFootDraft' not in s:
              anchor="  const [ageDraft, setAgeDraft] = useState(me.age || '');"
              assert anchor in s, 'age state not found'
              s=s.replace(anchor, anchor+"\n  const [preferredFootDraft, setPreferredFootDraft] = useState(me.preferred_foot || '');", 1)
          if 'value={preferredFootDraft}' not in s:
              start=s.index('function MyProfileCard(')
              end=s.index('\nfunction ', start+20)
              part=s[start:end]
              marker='''        <div className="sf-muted-sm" style={{ margin: '12px 0 6px' }}>WhatsApp'''
              assert marker in part, 'WhatsApp marker not found in MyProfileCard'
              block='''        <div className="sf-muted-sm" style={{ margin: '12px 0 6px' }}>Pé preferencial</div>\n        <select\n          className="sf-input"\n          value={preferredFootDraft}\n          onChange={(e) => setPreferredFootDraft(e.target.value)}\n          onBlur={() => onUpdate({ preferred_foot: preferredFootDraft || null })}\n        >\n          <option value="">Não informado</option>\n          <option value="direito">Direito / Destro</option>\n          <option value="esquerdo">Esquerdo / Canhoto</option>\n          <option value="ambidestro">Ambidestro</option>\n        </select>\n'''
              s=s[:start]+part.replace(marker,block+marker,1)+s[end:]
          old="const playerNames = useMemo(() => Object.fromEntries(roster.map((p) => [p.id, p.name])), [roster]);"
          new="const playerNames = useMemo(() => Object.fromEntries([...activePlayers, ...waitlistPlayers].map((p) => [p.id, displayName(p)])), [activePlayers, waitlistPlayers]);"
          assert old in s, 'playerNames source not found'
          s=s.replace(old,new,1)
          assert new in s
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/society-page.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(chat): restrict mentions to match roster"
          git push
