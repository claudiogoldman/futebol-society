name: Apply pitch draw audit patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-pitch-draw.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch pitch draw
        run: python scripts/patch-pitch-draw.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.js
          if git diff --cached --quiet; then
            echo 'No source changes were necessary.'
            exit 0
          fi
          git commit -m 'fix: position-aware team draw and pitch layout'
          git push origin HEAD:main
