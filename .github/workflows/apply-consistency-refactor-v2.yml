      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/society-page.js
          git commit -m "fix: align waitlist and group/game settings"
          git rm .github/workflows/apply-consistency-refactor.yml .github/workflows/apply-consistency-refactor-v2.yml
          git commit -m "chore: remove one-shot consistency workflows"
