name: Rebase game location patch
on:
  push:
    branches: [tmp/game-location-rebased]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: python scripts/apply-game-location-rebased.py
      - name: Commit generated source and remove patcher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply-game-location-rebased.py .github/workflows/rebase-game-location.yml
          git add app/page.js migrations/20260828_game_location.sql
          git diff --cached --quiet && exit 0 || true
          git commit -m 'feat: add game location to current main'
          git push origin HEAD:tmp/game-location-rebased
