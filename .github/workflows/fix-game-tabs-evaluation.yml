name: One-shot Game Tabs evaluation fix

on:
  push:
    branches:
      - refactor/game-teams-integration

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[game-tabs-evaluation-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix evaluation tab visibility
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/society-page.js')
          s = p.read_text(encoding='utf-8')
          old = '''      {game.result && hasTeams && (\n        <EvaluationSection game={game} myId={myId} onSaveRatings={onSaveRatings} />\n      )}'''
          new = '''      {game.result && hasTeams && (\n        <section data-game-section="resultado">\n          <EvaluationSection game={game} myId={myId} onSaveRatings={onSaveRatings} />\n        </section>\n      )}'''
          if old not in s:
              raise SystemExit('Expected EvaluationSection block was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Validate and commit
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git add app/society-page.js
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(game-detail): scope evaluation to result tab [game-tabs-evaluation-fixed]"
          git push origin HEAD:refactor/game-teams-integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
